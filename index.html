<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Calorie Tracker</title>
<!-- Dock app: Safari's Add to Dock opens it as a standalone app; theme-color tints the title bar to the wallpaper. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="theme-color" content="#7f9cc3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070b1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Calories">
<style>
/* ============================================================
   Calorie Tracker, on the macOS Tahoe 26 desktop (Tahoe starter)
   Tokens first, then wallpaper, day sheet,
   Control Center, Dock, responsive, fallbacks.
   ============================================================ */

:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-snap: cubic-bezier(0.23, 1, 0.32, 1);

  /* text over glass */
  --text-1: rgba(0, 0, 0, .85);
  --text-2: rgba(0, 0, 0, .66);        /* 4.5:1+ on the glass over the blue wave */
  --text-3: rgba(0, 0, 0, .30);
  --sep: rgba(60, 60, 67, .16);
  --hover: rgba(0, 0, 0, .045);
  --sel: rgba(0, 0, 0, .075);

  --accent: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  /* small coloured text on glass: the same hues, deepened (light) or lifted (dark) to 4.5:1 */
  --red-text: color-mix(in srgb, var(--red) 52%, #000);   /* 4.5:1+ on the glass, like --dt-red */
  --accent-text: color-mix(in srgb, var(--accent) 78%, #000);

  /* view + meal colours: icons and dots only, never text */
  --c-all: #6e6e73;
  --c-today: #007aff;
  --c-week: #ff3b30;
  --c-history: #8e8e93;
  --c-weight: #30b0c7;
  --c-breakfast: #ff9500;
  --c-lunch: #34c759;
  --c-snacks: #ff2d55;
  --c-dinner: #5856d6;
  /* macros (protein, carbs, fat) and food pictures: charts and icons only, never text */
  --mac-p: #32ade6;
  --mac-c: #ffcc00;
  --mac-f: #a2845e;
  --c-drinks: #00c7be;
  /* food pictures, one per canonical icon key (DATA.md) */
  --f-coffee: #a2845e;
  --f-tea: #00a99d;
  --f-bottle: #5f87ad;
  --f-can: #32ade6;
  --f-croissant: #ff9500;
  --f-toast: #c8873a;
  --f-cereal: #f0a830;
  --f-sandwich: #34c759;
  --f-wrap: #30b0c7;
  --f-burger: #b8662f;
  --f-pizza: #ff6a2b;
  --f-chips: #ff2d55;
  --f-crisps: #ff3b30;
  --f-bowl: #5856d6;
  --f-salad: #5aae3c;
  --f-banana: #ffc400;
  --f-apple: #d9304f;
  --f-chocolate: #8e4fd6;
  --f-sweets: #ff6fae;
  --f-biscuit: #b98552;
  --f-food: #8e8e93;
  --ring-track: rgba(60, 60, 67, .12);
  --tile-surface: rgba(255, 255, 255, .40);   /* food tiles on the sheet */
  --tile-edge: rgba(255, 255, 255, .55);
  --fill-top: 46%;   /* a tile's kcal fill: the meal colour from the top of the fill to its foot */
  --fill-foot: 30%;
  /* over and under maintenance: blue under, orange over. Charts only, never text.
     Calendar cells mix --cell-* into a solid --cell-base (so the blue wave can't turn orange grey), from --heat-min
     to --heat-min + --heat-range; the deepest still keeps the day number 4.5:1. */
  --heat-under: #32ade6;
  --heat-over: #ff9500;
  --cell-under: #32ade6;
  --cell-over: #ff9500;
  --cell-base: #ffffff;
  --cell-text: var(--text-1);
  --heat-min: 36%;
  --heat-range: 48%;

  /* wallpaper */
  --wp-base: #9fb4d0;
  --wp-sky-1: #7f9cc3;
  --wp-sky-2: #b4c2d6;
  --wp-sky-3: #eed8b4;
  --wp-sky-4: #d9dbe2;
  --wp-fold: #3577de;
  --wp-fold-hi: #8fb9ea;
  --wp-lip-1: #e3f1f7;
  --wp-lip-2: #8fc3ec;
  --wp-body-1: #2d6fe0;
  --wp-body-2: #1a4fc6;
  --wp-body-3: #3b7fe2;
  --wp-core: #0f3db4;
  --wp-glow: #6aa6ec;
  --wp-haze: #d3deec;
  --wp-crest: #ffffff;
  --wp-streak: #b6def5;

  /* glass: the task sheet */
  --sheet-bg: rgba(232, 238, 249, .56);
  --sheet-side: rgba(250, 251, 253, .62);
  --sheet-shadow: 0 24px 60px rgba(12, 36, 92, .22), 0 2px 10px rgba(12, 36, 92, .10);
  --rim-a: rgba(255, 255, 255, .90);
  --rim-b: rgba(255, 255, 255, .28);
  --field-bg: rgba(255, 255, 255, .78);
  --round-bg: rgba(255, 255, 255, .55);
  --tick-ring: rgba(0, 0, 0, .45);       /* 3:1 against the glass */
  --badge-ring: rgba(244, 247, 252, .95);

  /* tiles (Edit Controls) */
  /* the Details tiles' deep blue, so white titles and the pale subtitles keep 4.5:1 over the light glass */
  --tile-bg: linear-gradient(160deg, rgba(0, 62, 170, .74), rgba(0, 54, 156, .78));
  --tile-text: #fff;
  --tile-sub: #e0edff;
  --tile-warn: #ffe6e3;
  --tile-tick: rgba(255, 255, 255, .20);

  /* Control Center */
  --cc-bg: linear-gradient(150deg, rgba(0, 46, 150, .40), rgba(0, 40, 140, .46) 55%, rgba(0, 46, 150, .42));   /* deep blue glass: white text 4.5:1+ over the bright wave */
  --cc-text: #fff;
  --cc-text-2: rgba(255, 255, 255, .9);
  --cc-blur: blur(24px) saturate(190%) brightness(.68);   /* dims a bright backdrop (the crest, the pale sky) under white text */
  --cc-label-bg: var(--cc-bg);          /* labels sit on bare wallpaper: a small glass pill keeps them 4.5:1 over the crest (both modes) */
  --cc-label-filter: var(--cc-blur);
  --cc-off: rgba(255, 255, 255, .20);
  --cc-on: rgba(255, 255, 255, .97);
  --cc-on-fg: #1a78f2;
  --cc-track: rgba(255, 255, 255, .30);
  --cc-shadow: 0 8px 24px rgba(8, 40, 120, .16);

  /* Dock */
  --dock-bg: rgba(255, 255, 255, .26);
  --dock-sep: rgba(0, 0, 0, .16);
  --dock-dot: rgba(0, 0, 0, .55);
  --badge-bg: rgba(255, 255, 255, .94);
  --badge-text: rgba(0, 0, 0, .78);
  --badge-rim: rgba(0, 0, 0, .06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --text-1: rgba(255, 255, 255, .92);
    --text-2: rgba(255, 255, 255, .64);
    --text-3: rgba(255, 255, 255, .34);
    --sep: rgba(255, 255, 255, .12);
    --hover: rgba(255, 255, 255, .06);
    --sel: rgba(255, 255, 255, .10);

    /* system blue in dark too, like refs 12-14 */
    --accent: #0a84ff;
    --red: #ff453a;
    --orange: #ff9f0a;
    --red-text: color-mix(in srgb, var(--red) 66%, #fff);
    --accent-text: color-mix(in srgb, var(--accent) 75%, #fff);

    --c-all: #98989d;
    --c-today: #0a84ff;
    --c-week: #ff453a;
    --c-history: #98989d;
    --c-weight: #40c8e0;
    --c-breakfast: #ff9f0a;
    --c-lunch: #30d158;
    --c-snacks: #ff4f74;
    --c-dinner: #8e8cff;
    --mac-p: #64d2ff;
    --mac-c: #ffd60a;
    --mac-f: #c49a6c;
    --c-drinks: #63e6e2;
    --f-coffee: #c9a479;
    --f-tea: #2fc4b8;
    --f-bottle: #8fb2d6;
    --f-can: #64d2ff;
    --f-croissant: #ff9f0a;
    --f-toast: #d29552;
    --f-cereal: #ffb340;
    --f-sandwich: #30d158;
    --f-wrap: #40c8e0;
    --f-burger: #c97a45;
    --f-pizza: #ff7a45;
    --f-chips: #ff4f74;
    --f-crisps: #ff453a;
    --f-bowl: #7d7aff;
    --f-salad: #6cc24a;
    --f-banana: #ffcc00;
    --f-apple: #ff4d6a;
    --f-chocolate: #9a5de0;
    --f-sweets: #ff7ab8;
    --f-biscuit: #c9955f;
    --f-food: #b9b9c0;
    --ring-track: rgba(255, 255, 255, .10);
    --tile-surface: rgba(255, 255, 255, .07);
    --tile-edge: rgba(255, 255, 255, .10);
    --fill-top: 34%;
    --fill-foot: 20%;
    --heat-under: #64d2ff;
    --heat-over: #ff9f0a;
    /* dark: the cells stay vivid (the hue itself at the top end) and carry dark text, which keeps 4.5:1 down to the
       palest cell; darkening the hue for white text turned the orange brown on the navy */
    --today-ring: var(--text-1);
    --today-w: 2.5px;
    --cell-under: #64d2ff;
    --cell-over: #ff9f0a;
    --cell-base: #1c1d26;
    --cell-text: rgba(0, 0, 0, .85);
    --heat-min: 68%;
    --heat-range: 32%;

    --wp-base: #0a0f22;
    --wp-sky-1: #070b1a;
    --wp-sky-2: #10162e;
    --wp-sky-3: #24203c;
    --wp-sky-4: #161b34;
    --wp-fold: #1a3c92;
    --wp-fold-hi: #2f4f9c;
    --wp-lip-1: #5d79b8;
    --wp-lip-2: #23448f;
    --wp-body-1: #12307f;
    --wp-body-2: #0a1d5a;
    --wp-body-3: #163a8c;
    --wp-core: #050f3a;
    --wp-glow: #22479a;
    --wp-haze: #26294a;
    --wp-crest: #b9ccff;
    --wp-streak: #4a6fc0;

    --sheet-bg: rgba(22, 24, 34, .38);
    --sheet-side: rgba(36, 38, 48, .42);
    --sheet-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 2px 10px rgba(0, 0, 0, .25);
    --rim-a: rgba(255, 255, 255, .34);
    --rim-b: rgba(255, 255, 255, .08);
    --field-bg: rgba(255, 255, 255, .08);
    --round-bg: rgba(255, 255, 255, .10);
    --tick-ring: rgba(255, 255, 255, .42);
    --badge-ring: rgba(30, 32, 42, .95);

    --tile-bg: linear-gradient(160deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .07));
    --tile-text: rgba(255, 255, 255, .94);
    --tile-sub: #8cc8ff;                 /* blue, not amber: one accent in both modes */
    --tile-warn: #ffaaa4;
    --tile-tick: rgba(255, 255, 255, .10);

    --cc-bg: linear-gradient(150deg, rgba(40, 44, 62, .42), rgba(22, 24, 36, .30) 55%, rgba(34, 38, 56, .38));
    --cc-text: rgba(255, 255, 255, .94);
    --cc-text-2: rgba(255, 255, 255, .72);
    --cc-blur: blur(24px) saturate(190%);
    --cc-off: rgba(255, 255, 255, .11);
    --cc-on: rgba(255, 255, 255, .92);
    --cc-on-fg: #0a84ff;                 /* on toggles: white disc, system blue glyph (was orange) */
    --cc-track: rgba(255, 255, 255, .16);
    --cc-shadow: 0 8px 24px rgba(0, 0, 0, .35);

    --dock-bg: rgba(26, 28, 40, .40);
    --dock-sep: rgba(255, 255, 255, .16);
    --dock-dot: rgba(255, 255, 255, .6);
    --badge-bg: rgba(64, 66, 80, .96);
    --badge-text: rgba(255, 255, 255, .92);
    --badge-rim: rgba(255, 255, 255, .22);
  }
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.25;
  color: var(--text-1);
  background: var(--wp-base);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: default; }
input { border: 0; outline: 0; background: transparent; padding: 0; min-width: 0; }
svg.ic { width: 1em; height: 1em; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic--fill { fill: currentColor; stroke: none; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* shared Liquid Glass rim: bright top-left and bottom-right, dim sides */
.rim { position: relative; }
.rim::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, var(--rim-a) 0%, var(--rim-b) 28%, rgba(255,255,255,0) 50%, var(--rim-b) 72%, var(--rim-a) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  z-index: 3;
}

/* ---------- wallpaper ---------- */
.wallpaper { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
.wallpaper svg { width: 100%; height: 100%; display: block; }
.wp-s1 { stop-color: var(--wp-sky-1); }
.wp-s2 { stop-color: var(--wp-sky-2); }
.wp-s3 { stop-color: var(--wp-sky-3); }
.wp-s4 { stop-color: var(--wp-sky-4); }
.wp-b0 { stop-color: var(--wp-lip-1); }
.wp-b1 { stop-color: var(--wp-lip-2); }
.wp-b2 { stop-color: var(--wp-body-1); }
.wp-b3 { stop-color: var(--wp-body-2); }
.wp-b4 { stop-color: var(--wp-body-3); }
.wp-fold { fill: var(--wp-fold); }
.wp-fold-hi { fill: var(--wp-fold-hi); }
.wp-core { fill: var(--wp-core); }
.wp-glow { fill: var(--wp-glow); }
.wp-haze { fill: var(--wp-haze); }
.wp-crest { stroke: var(--wp-crest); fill: none; }
.wp-streak { stroke: var(--wp-streak); fill: none; }
.wp-lip { stroke: var(--wp-lip-1); fill: none; }
/* Static glass (see glass in the script): the SVG above is drawn once into this canvas, then hidden, so its
   blurs never re-render. Cover + centre is the SVG's xMidYMid slice. */
.wallpaper__raster { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 50%; }
.wallpaper.is-raster svg { display: none; }
/* Glass that sits still on the wallpaper gets its blurred backdrop as a baked image (--baked, same blur and
   saturation, edges mirrored like backdrop-filter) instead of a live backdrop-filter. Same look, no re-blur per frame.
   Two steps so there is never a frame without blur: .is-baking lays the decoded image over the live blur (it is
   opaque, so the look doesn't change), and only frames later .is-baked turns the live blur off. */
.sheet:is(.is-baking, .is-baked) { background: linear-gradient(var(--sheet-bg), var(--sheet-bg)), var(--baked) 0 0 / 100% 100% no-repeat; }
.cc-sort__label:is(.is-baking, .is-baked) { background: var(--cc-label-bg), var(--baked) 0 0 / 100% 100% no-repeat; }
.cc-edit:is(.is-baking, .is-baked) { background: var(--cc-bg), var(--baked) 0 0 / 100% 100% no-repeat; }
/* Control Center and the Dock too: a full-window fade above them (Task details' backdrop) made every one of their
   live blurs re-render on every frame of the fade */
.cc-mod:is(.is-baking, .is-baked) { background: var(--cc-bg), var(--baked) 0 0 / 100% 100% no-repeat; }
.cc-round.is-on:is(.is-baking, .is-baked) { background: linear-gradient(var(--cc-on), var(--cc-on)), var(--baked) 0 0 / 100% 100% no-repeat; }
.dock:is(.is-baking, .is-baked) { background: linear-gradient(var(--dock-bg), var(--dock-bg)), var(--baked) 0 0 / 100% 100% no-repeat; }
:is(.sheet, .cc-sort__label, .cc-edit, .cc-mod, .dock).is-baked { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* ---------- desktop layout ---------- */
.desktop {
  position: relative; z-index: 1; height: 100vh; height: 100dvh;
  /* the sheet sits centred in the space left of Control Center and grows with the window */
  --top-gap: 28px;                                   /* wallpaper above the sheet */
  --dock-clear: 100px;                               /* Dock (6px off the bottom, 68px tall) plus a 26px gap */
  --cc-w: 288px;
  --cc-right: 12px;
  --stage: calc(100vw - var(--cc-w) - var(--cc-right));  /* width left of Control Center */
  --edge: clamp(32px, 5vw, 72px);                    /* wallpaper either side of the sheet */
}

/* ---------- the task sheet (Edit Controls, refs 12 + 14) ---------- */
.sheet {
  position: absolute;
  top: var(--top-gap);
  bottom: var(--dock-clear);
  left: calc(var(--stage) / 2);
  width: min(1120px, calc(var(--stage) - 2 * var(--edge)));
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: clamp(196px, 22%, 232px) minmax(0, 1fr);
  border-radius: 26px;
  overflow: hidden;
  background: var(--sheet-bg);
  -webkit-backdrop-filter: blur(34px) saturate(165%);
  backdrop-filter: blur(34px) saturate(165%);
  box-shadow: var(--sheet-shadow), inset 0 0 0 .5px rgba(255,255,255,.18);
}

/* sidebar */
.side {
  min-height: 0;
  overflow: auto;
  padding: 14px 10px 14px;
  background: var(--sheet-side);
  border-right: .5px solid var(--sep);
}
.nav { list-style: none; margin: 0; padding: 0; }
.navrow {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  height: 38px;
  padding: 0 10px 0 8px;
  border-radius: 10px;
  text-align: left;
}
.navrow:hover { background: var(--hover); }
.navrow[aria-current="page"] { background: var(--sel); }
.navrow__label { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navrow__count { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* coloured squircle icons */
.sq {
  --c: var(--c-all);
  width: 24px; height: 24px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 7px;
  color: #fff;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c));
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.4), 0 .5px 1.5px rgba(0,0,0,.18);
  font-size: 15px;
}
.sq .ic { stroke-width: 2; }
.sq--today { --c: var(--c-today); }
.sq--week { --c: var(--c-week); }
.sq--history { --c: var(--c-history); }
.sq--weight { --c: var(--c-weight); }
@media (prefers-color-scheme: dark) {
  .sq { background: rgba(255,255,255,.10); color: var(--c); box-shadow: inset 0 .5px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.08); }
}

/* main pane */
.pane { min-height: 0; display: flex; flex-direction: column; }

/* the day, visual first (Fitness-style summary): a big ring with the macro split under it on the left, the food
   as tiles grouped by meal on the right; the pane's own width picks the layout (container queries) */
.pane__scroll { flex: 1; min-height: 0; overflow: auto; padding: 0 14px 8px; scrollbar-width: thin; scrollbar-color: var(--text-3) transparent; container: pane / inline-size; }
.today { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 38%, 300px); column-gap: 24px; align-items: start; padding: 16px 4px 8px; }

/* hero: title, the ring, macros */
.hero { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "day" "gauge" "macros"; justify-items: center; }
.day { grid-area: day; justify-self: stretch; margin: 0 0 12px; }
.day__title { margin: 0; font-size: 26px; font-weight: 700; line-height: 32px; letter-spacing: -0.02em; }
.day__back { display: inline-flex; align-items: center; gap: 5px; margin: 0 0 6px -2px; padding: 3px 9px 3px 6px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 16px; color: var(--accent); text-decoration: none; background: color-mix(in srgb, var(--accent) 12%, transparent); }
.day__back .ic { width: 14px; height: 14px; }
.day__back:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.day__back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.day__date { margin: 1px 0 0; font-size: 13px; line-height: 16px; color: var(--text-2); }

/* the ring: kcal so far against maintenance, one arc per meal in the meal's colour, the rest is what's left */
.gauge { grid-area: gauge; position: relative; width: min(100%, 420px); aspect-ratio: 1; container-type: inline-size; }
.gauge__ring { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.gauge__track, .gauge__seg { fill: none; stroke-width: 20; }
.gauge__track { stroke: var(--ring-track); }
.gauge__seg--breakfast { stroke: var(--c-breakfast); }
.gauge__seg--lunch { stroke: var(--c-lunch); }
.gauge__seg--snacks { stroke: var(--c-snacks); }
.gauge__seg--dinner { stroke: var(--c-dinner); }
.gauge__seg--drinks { stroke: var(--c-drinks); }
.gauge__centre { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.gauge__num { font-size: clamp(44px, 25cqi, 104px); font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.gauge__of { margin-top: 8px; font-size: clamp(13px, 3.8cqi, 16px); line-height: 1.25; color: var(--text-2); font-variant-numeric: tabular-nums; }
.gauge__left { margin: clamp(10px, 4cqi, 18px) 0 0; font-size: clamp(14px, 4.2cqi, 17px); font-weight: 500; line-height: 1.3; color: var(--text-2); }
.gauge__left b { margin-right: 4px; font-size: clamp(20px, 6.4cqi, 27px); font-weight: 700; letter-spacing: -0.01em; color: var(--text-1); font-variant-numeric: tabular-nums; }

/* macros: each one's share of the day's calories, as a donut in three hues with its key beside it */
.macros { grid-area: macros; justify-self: stretch; margin-top: 16px; padding-top: 14px; border-top: .5px solid var(--sep); container: macros / inline-size; }
.macros__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.macros__title { margin: 0; font-size: 13px; font-weight: 600; line-height: 16px; }
.macros__aside { font-size: 12px; line-height: 15px; color: var(--text-2); white-space: nowrap; }
.macros__body { display: flex; align-items: center; gap: 16px; }
.donut { width: 76px; height: 76px; flex: none; display: block; transform: rotate(-90deg); }
.donut__track, .donut__seg { fill: none; stroke-width: 15; }
.donut__track { stroke: var(--ring-track); }
.donut__seg--p { stroke: var(--mac-p); }
.donut__seg--c { stroke: var(--mac-c); }
.donut__seg--f { stroke: var(--mac-f); }
.macros__list { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; max-width: 240px; display: grid; gap: 8px; }
.macro { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; column-gap: 7px; font-size: 13px; line-height: 16px; white-space: nowrap; }
.macro__key { width: 10px; height: 10px; border-radius: 50%; background: var(--k); }
.macro--p { --k: var(--mac-p); }
.macro--c { --k: var(--mac-c); }
.macro--f { --k: var(--mac-f); }
.macro__name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.macro__g { color: var(--text-2); font-variant-numeric: tabular-nums; }
.macro__pct { min-width: 32px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
@container macros (max-width: 259px) {
  /* too narrow for the donut and the key side by side (the names were cut to "Pro…"): the key goes under it */
  .macros__body { flex-direction: column; align-items: flex-start; gap: 12px; }
  .macros__list { width: 100%; max-width: none; }
  .macro { column-gap: 8px; }
}

/* the food: big tiles grouped by meal (ref 12's tiles: a picture, a short label, one number). Each tile fills up
   from the bottom in its meal's colour as far as its kcal goes (a full tile is 500 kcal). Details come later. */
.foodgrid { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.meal { --m: var(--c-all); position: relative; isolation: isolate; scroll-margin: 8px 0; }
.meal--breakfast { --m: var(--c-breakfast); }
.meal--lunch { --m: var(--c-lunch); }
.meal--snacks { --m: var(--c-snacks); }
.meal--dinner { --m: var(--c-dinner); }
.meal--drinks { --m: var(--c-drinks); }
.meal__head { display: flex; align-items: center; gap: 7px; margin: 0 4px 7px; font-size: 13px; font-weight: 600; line-height: 16px; }
.meal__dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--m); }
.meal__time { min-width: 0; font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meal__kcal { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* a Dock click shows where that meal is: a brief highlight behind it, opacity only */
.meal::after { content: ""; position: absolute; z-index: -2; inset: -6px; border-radius: 22px; background: var(--sel); opacity: 0; pointer-events: none; transition: opacity 500ms var(--ease-snap); }
.meal.is-flash::after { opacity: 1; transition-duration: 150ms; }

.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile {
  position: relative; isolation: isolate; overflow: hidden;
  min-width: 0;
  height: auto; min-height: 96px;   /* a long name wraps to a second line, so the tile can grow */
  padding: 10px 12px 10px 10px;
  border-radius: 20px;
  background: var(--tile-surface);
  box-shadow: inset 0 0 0 .5px var(--tile-edge);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "icon kcal" "icon ." "name name";
}
.tile--wide { grid-column: span 2; }
/* the fill: as high as the food's kcal on the one scale (500 kcal fills a tile), grows in with transform only */
.tile::before {
  content: ""; position: absolute; z-index: -1; left: 0; right: 0; bottom: 0;
  height: max(6px, calc(var(--k) / 500 * 100%));
  background: linear-gradient(color-mix(in srgb, var(--m) var(--fill-top), transparent), color-mix(in srgb, var(--m) var(--fill-foot), transparent));   /* no hard top line: it read as a strike-through where it crossed a label */
  transform-origin: bottom;
  animation: fill-in 800ms var(--ease-sheet) both;
}
@keyframes fill-in { from { transform: scaleY(0); } }
.tile .food__icon { grid-area: icon; width: 46px; height: 46px; border-radius: 12px; }
.tile__kcal { grid-area: kcal; justify-self: end; text-align: right; font-size: 22px; font-weight: 700; line-height: 24px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile__kcal small { display: block; font-size: 12px; font-weight: 500; line-height: 14px; letter-spacing: 0; }
.tile__name { grid-area: name; min-width: 0; margin-top: 4px; font-size: 13px; font-weight: 600; line-height: 16px; overflow-wrap: break-word; }   /* the whole name, on as many lines as it takes: the tile grows */
/* Today's tiles: every icon and kcal number in a row the same size. A tile whose number won't fit beside its icon
   (a 4-digit kcal on a narrow tile) takes the whole row instead (packTiles), so nothing has to shrink. */
.foodgrid .tiles { grid-auto-flow: row dense; }   /* a tile made wide (packTiles) leaves no hole */
.foodgrid .tile { --kf: 22px; --ic: 46px; }
.foodgrid .tile__kcal { font-size: var(--kf); }
.foodgrid .tile .food__icon { width: var(--ic); height: var(--ic); }
/* an empty meal: a dashed tile where its food will go */
.tile--empty { height: auto; min-height: 64px; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "icon name"; align-items: center; column-gap: 12px; background: none; box-shadow: none; border: 1.5px dashed color-mix(in srgb, var(--m) 55%, transparent); }
.tile--empty::before { content: none; }
.tile--empty .tile__name { display: block; margin-top: 0; font-weight: 400; color: var(--text-2); -webkit-line-clamp: none; line-clamp: none; }

/* food pictures: SF-Symbol-like glyphs on squircles in the food's own colour (icons, so colour is fine here) */
.food__icon {
  --f: var(--c-all);
  display: grid; place-items: center;
  overflow: hidden;
  background:
    radial-gradient(130% 72% at 50% -10%, rgba(255,255,255,.40), rgba(255,255,255,0) 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--f) 74%, #fff) 0%, var(--f) 50%, color-mix(in srgb, var(--f) 80%, #000) 100%);
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.16), 0 1px 3px rgba(0,0,0,.18);
}
.food__icon svg { width: 78%; height: 78%; overflow: visible; filter: drop-shadow(0 1px .8px rgba(0,0,0,.22)); }
.food__icon .g-main { fill: url(#glyphLight); }
.food__icon .g-sub { fill: rgba(255,255,255,.62); }
.food__icon .g-in { fill: color-mix(in srgb, var(--f) 36%, #fff); }
.food__icon .g-cut { fill: none; stroke: color-mix(in srgb, var(--f) 55%, #fff); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.food__icon .g-line { fill: none; stroke: url(#glyphLight); stroke-width: 2.8; stroke-linecap: round; }
.food__icon .g-steam { fill: none; stroke: rgba(255,255,255,.72); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.food__icon .g-red { fill: var(--red); }
/* sandwich parts: the crumb, the ham and the lettuce between the slices */
.g-crumb { fill: #fff2d2; }
.g-ham { fill: #ff8fa0; }
.g-leaf { fill: none; stroke: #c9f5a8; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
/* the parts the newer pictures add: a white stalk or fork, a coloured tag, butter, chips, the patty, pepperoni, greens */
.food__icon .g-stem { fill: none; stroke: rgba(255,255,255,.88); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.food__icon .g-tag { fill: color-mix(in srgb, var(--f) 82%, #fff); }
.food__icon .plate-rim { fill: none; stroke: color-mix(in srgb, var(--f) 40%, #fff); stroke-width: 1.4; }
.g-butter { fill: #ffe58f; }
.g-fry { fill: #ffe17a; }
.g-crust { fill: #ffd79a; }
.g-patty { fill: #7a3b1c; }
.g-pep { fill: #e5372b; }
.g-greens { fill: #c9f5a8; }
.g-chip { fill: #6b3d1d; }
.food__icon--coffee { --f: var(--f-coffee); }
.food__icon--tea { --f: var(--f-tea); }
.food__icon--bottle { --f: var(--f-bottle); }
.food__icon--can { --f: var(--f-can); }
.food__icon--croissant { --f: var(--f-croissant); }
.food__icon--toast { --f: var(--f-toast); }
.food__icon--cereal { --f: var(--f-cereal); }
.food__icon--sandwich { --f: var(--f-sandwich); }
.food__icon--wrap { --f: var(--f-wrap); }
.food__icon--burger { --f: var(--f-burger); }
.food__icon--pizza { --f: var(--f-pizza); }
.food__icon--chips { --f: var(--f-chips); }
.food__icon--crisps { --f: var(--f-crisps); }
.food__icon--bowl { --f: var(--f-bowl); }
.food__icon--salad { --f: var(--f-salad); }
.food__icon--banana { --f: var(--f-banana); }
.food__icon--apple { --f: var(--f-apple); }
.food__icon--chocolate { --f: var(--f-chocolate); }
.food__icon--sweets { --f: var(--f-sweets); }
.food__icon--biscuit { --f: var(--f-biscuit); }
.food__icon--food { --f: var(--f-food); }
.food__icon--empty { background: color-mix(in srgb, var(--m) 16%, transparent); box-shadow: none; }
.food__icon--empty svg { filter: none; }
.food__icon--empty .g-main { fill: var(--m); }
.food__icon--empty .plate-rim { fill: none; stroke: color-mix(in srgb, var(--m) 40%, #fff); stroke-width: 1.4; }
.food__icon--empty .g-cut { stroke: var(--m); stroke-width: 2; }

/* nothing logged today: one calm card where the meals will go, the four meal icons over a dashed outline */
.day-empty { display: grid; justify-items: center; padding: 32px 24px 24px; border-radius: 22px; border: 1.5px dashed color-mix(in srgb, var(--text-2) 42%, transparent); text-align: center; }
.day-empty__meals { list-style: none; margin: 0 0 16px; padding: 0; display: flex; gap: 8px; }
.day-empty__meals .app-icon { width: 46px; height: 46px; border-radius: 11px; }
.day-empty__meals li:nth-child(odd) { transform: rotate(-6deg); }
.day-empty__meals li:nth-child(even) { transform: translateY(-5px) rotate(5deg); }
.day-empty__title { margin: 0; font-size: 17px; font-weight: 600; line-height: 22px; }
.day-empty__text { margin: 4px 0 0; max-width: 32ch; font-size: 13px; line-height: 18px; color: var(--text-2); text-wrap: balance; }
.day-empty__eg { margin: 16px 0 0; display: grid; gap: 2px; max-width: 100%; padding: 9px 16px 10px; border-radius: 18px 18px 18px 6px; background: var(--tile-surface); box-shadow: inset 0 0 0 .5px var(--tile-edge); font-size: 13px; line-height: 17px; text-align: left; }   /* a message bubble */
.day-empty__eg b { font-size: 11px; font-weight: 600; letter-spacing: .01em; line-height: 13px; color: var(--text-2); }
.macro__pct.is-none { color: var(--text-2); font-weight: 500; }

/* a narrower pane: the ring and macros side by side, the meals below in as many columns as fit */
@container pane (max-width: 599px) {
  .today { grid-template-columns: minmax(0, 1fr); row-gap: 24px; }
  .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 210px); grid-template-areas: "day day" "gauge macros"; column-gap: 24px; align-items: center; }
  .macros { margin-top: 0; padding-top: 0; border-top: 0; }
  .foodgrid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); align-items: start; gap: 16px 14px; }
}
/* a tall pane (Jamie's 2560x1440 display): the day grows into the height. --pane-h is the scroll area's height on
   the desktop sheet (window less the 28px top, the 100px Dock clearance and the 52px footer); at 1440x900 it's 720,
   where everything below works out to the sizes above. The hero fills the pane, the ring centred in it. */
@media (min-width: 1024px) and (min-height: 620px) {
  .desktop { --pane-h: calc(100dvh - 180px); }
}
@container pane (min-width: 600px) {
  .hero { align-self: start; min-height: calc(var(--pane-h, 0px) - 32px); grid-template-rows: auto minmax(0, 1fr) auto; align-items: center; }
  .gauge { width: min(100%, max(300px, calc(var(--pane-h, 720px) - 240px))); }
  .gauge__num { font-size: clamp(44px, 25cqi, 136px); }
  .gauge__of { font-size: clamp(13px, 3.8cqi, 19px); }
  .gauge__left { font-size: clamp(14px, 4.2cqi, 20px); }
  .gauge__left b { font-size: clamp(20px, 6.4cqi, 32px); }
  .macros { --g: clamp(0px, calc(var(--pane-h, 720px) - 720px), 430px); }   /* 0 at 720, 430 at 1150 */
  .hero .macros__title { font-size: calc(13px + var(--g) * .005); line-height: 1.25; }
  .hero .macros__body { gap: calc(16px + var(--g) * .03); }
  .hero .donut { width: calc(76px + var(--g) * .15); height: calc(76px + var(--g) * .15); }
  .hero .macros__list { max-width: calc(240px + var(--g) * .2); gap: calc(8px + var(--g) * .01); }
  .hero .macro { font-size: calc(13px + var(--g) * .007); line-height: 1.25; }
  .hero .macro__key { width: calc(10px + var(--g) * .005); height: calc(10px + var(--g) * .005); }
  .foodgrid { --g: clamp(0px, calc(var(--pane-h, 720px) - 720px), 430px); align-self: start; }
  .foodgrid .tile { min-height: calc(96px + var(--g) * .14); }
  .foodgrid .tile { --ic: clamp(46px, min(46px + var(--g) * .023, 46px + (38cqi - 250px) * .2), 56px); --kf: clamp(22px, min(22px + var(--g) * .01, 22px + (38cqi - 250px) * .08), 26px); }   /* and only as the food column widens */
  .foodgrid .tile__kcal { line-height: 1.1; }
  .foodgrid .tile__name { font-size: calc(13px + var(--g) * .003); line-height: 1.25; }
  .foodgrid:has(> .day-empty) { min-height: calc(var(--pane-h, 0px) - 32px); }
  .foodgrid .day-empty { align-content: center; }
}
/* phone width: one column, ring first, then macros, then the food */
@container pane (max-width: 459px) {
  .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "day" "gauge" "macros"; }
  .macros { margin-top: 18px; padding-top: 14px; border-top: .5px solid var(--sep); }
}

/* ---------- the other views: This Week, History, Weight ----------
   Same parts as Today: one big hero on the sheet first (the week's bars, the calendar heatmap, the weight line),
   then a few tiles in the food tiles' surface. Drawn from the log in the script; only one view shows at a time. */
[data-panel][hidden], .cc-mod[hidden] { display: none !important; }
.view { display: grid; grid-template-columns: minmax(0, 1fr); row-gap: 24px; align-content: start; padding: 16px 4px 0; }   /* the scroll area adds the 8px under it */
.view > .day, .vcard > .day { grid-area: auto; margin: 0 0 -12px; }   /* 12px to the hero, like Today */
.view-in { animation: view-in 280ms var(--ease-snap) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes grow-x { from { transform: scaleX(0); } }

/* tiles for the supporting numbers: the food tiles' surface, a title row like Macros */
.card { min-width: 0; padding: 14px 16px 16px; border-radius: 22px; background: var(--tile-surface); box-shadow: inset 0 0 0 .5px var(--tile-edge); }
.card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.card__title { margin: 0; font-size: 13px; font-weight: 600; line-height: 16px; }
.card__aside { font-size: 12px; line-height: 15px; color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card__note { margin: 8px 0 0; font-size: 12px; line-height: 16px; color: var(--text-2); text-wrap: pretty; }
.big { font-size: 34px; font-weight: 700; line-height: 38px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big small { margin-left: 4px; font-size: 15px; font-weight: 500; letter-spacing: 0; color: var(--text-2); }
/* a tinted capsule for a change (+260 a day, +0.5 kg): dark text on a pale tint, so no coloured text */
.chip { --chip: var(--heat-over); display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 13px; font-size: 13px; font-weight: 600; line-height: 1; color: var(--text-1); font-variant-numeric: tabular-nums; white-space: nowrap; background: color-mix(in srgb, var(--chip) 26%, transparent); }
.sq--lg { width: 34px; height: 34px; border-radius: 9px; font-size: 20px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; line-height: 15px; color: var(--text-2); }
.legend li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend__key { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--k); }
.legend__key--line { width: 16px; height: 0; border-radius: 0; border-top: 1.5px dashed var(--text-2); background: none; }
.legend__key--today { background: none; box-shadow: inset 0 0 0 1.5px var(--today-ring, rgba(0, 0, 0, .5)); }

/* This Week: seven big bars stacked in the meal colours (the ring's colours), maintenance dashed across them */
.wk-chart { --gut: 48px; --gap: 16px; --bar-w: 56px; }
.wk-chart__plot { position: relative; height: clamp(160px, 20cqi, 270px); margin-top: 0; padding-right: var(--gut); display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: var(--gap); align-items: end; box-shadow: 0 1px 0 var(--sep); }
.wk-col { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.wk-bar { width: min(100%, var(--bar-w)); height: var(--h); display: flex; flex-direction: column-reverse; gap: 2px; border-radius: 12px 12px 5px 5px; overflow: hidden; transform-origin: bottom; animation: fill-in 760ms var(--ease-sheet) both; animation-delay: calc(var(--i) * 45ms); }
.wk-seg { flex: var(--k) 1 0; min-height: 0; background: linear-gradient(color-mix(in srgb, var(--m) 86%, #fff), var(--m)); }
.wk-col__val { position: absolute; left: 50%; bottom: calc(var(--h) + 6px); transform: translateX(-50%); font-size: 13px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; animation: fade-in 400ms var(--ease-snap) both; animation-delay: calc(300ms + var(--i) * 45ms); }
/* today isn't over: what's left up to maintenance as a dashed outline above the bar */
.wk-ghost { position: absolute; bottom: var(--h); width: min(100%, var(--bar-w)); height: calc(var(--line) - var(--h)); border: 1.5px dashed var(--tick-ring); border-bottom: 0; border-radius: 12px 12px 0 0; animation: fade-in 400ms var(--ease-snap) both; animation-delay: 500ms; }
.wk-line { position: absolute; z-index: 2; left: 0; right: 0; bottom: var(--y); border-top: 1.5px dashed var(--text-2); pointer-events: none; }
.wk-line__tag { position: absolute; right: 0; bottom: 4px; font-size: 12px; font-weight: 600; line-height: 15px; font-variant-numeric: tabular-nums; }
.wk-line__tag small { display: block; font-size: 11px; font-weight: 500; color: var(--text-2); text-align: right; }
.wk-chart__days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: var(--gap); padding-right: var(--gut); margin-top: 8px; text-align: center; font-size: 12px; line-height: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.wk-chart__days b { display: block; font-size: 13px; font-weight: 600; line-height: 16px; color: var(--text-1); }
.wk-chart__days .is-today b { justify-self: center; display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--sel); }
.wk-chart__days .is-today span { display: block; }
.wk-chart .legend { margin-top: 12px; }

/* two columns of cards: tops, headings and bottoms level, 14px between everything. The left column is a stack whose
   last card (Macros) takes up any spare height, so neither column leaves a bigger gap. */
.wk-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.wk-stack { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.wk-mac { flex: 1; display: flex; flex-direction: column; }
.wk-mac .macros__body { flex: 1; }
.wk-foods { padding-bottom: 14px; }
.wk-foods .tile { background: var(--tile-surface); }
.wk-avg__top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.wk-mac .macros__body { gap: 14px; }
/* you against maintenance, two bars on the same scale */
.cmp { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 12px; margin-top: 12px; font-size: 12px; line-height: 15px; }
.cmp__name { color: var(--text-2); }
.cmp__track { height: 10px; border-radius: 5px; background: var(--ring-track); overflow: hidden; }
.cmp__bar { display: block; width: var(--w); height: 100%; border-radius: inherit; background: var(--k); transform-origin: left; animation: grow-x 700ms var(--ease-sheet) both; animation-delay: 150ms; }
.cmp__val { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
/* the foods tiles count days, not kcal: a full tile is every day of the week */
.wk-foods .tile__kcal small { white-space: nowrap; }
.wk-foods .tile { height: auto; min-height: 80px; border-radius: 12px; }   /* inside a 22px card with 16px padding: a smaller radius, like the standard's small tiles */
.wk-foods .tile__name { display: block; -webkit-line-clamp: none; line-clamp: none; overflow: visible; overflow-wrap: anywhere; margin-top: 6px; }

/* not logged (no row for the day): no bar, a dash where the number goes */
.wk-col.is-none .wk-col__val { color: var(--text-2); font-weight: 500; }
/* nothing logged this week: a dashed note above the chart (not on it), with three little stacked bars */
.wk-empty { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; margin: 4px 0 12px; padding: 12px 16px; border-radius: 20px; border: 1.5px dashed color-mix(in srgb, var(--text-2) 42%, transparent); }
.wk-empty__pic { flex: none; display: flex; align-items: flex-end; gap: 4px; height: 44px; }
.wk-empty__pic > span { width: 11px; height: var(--h); display: flex; flex-direction: column-reverse; gap: 1.5px; border-radius: 4px 4px 2px 2px; overflow: hidden; }
.wk-empty__pic i { flex: var(--k) 1 0; background: linear-gradient(color-mix(in srgb, var(--m) 86%, #fff), var(--m)); }
.wk-empty__text { min-width: 0; font-size: 13px; line-height: 17px; color: var(--text-2); }
.wk-empty .day-empty__eg { margin: 0; }
.wk-empty__text b { display: block; font-size: 15px; font-weight: 600; line-height: 20px; color: var(--text-1); }
/* a card with nothing to show yet: a dashed tile with the plate, like an empty meal */
.empty-note { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 8px; border-radius: 20px; border: 1.5px dashed color-mix(in srgb, var(--m, var(--c-all)) 55%, transparent); font-size: 13px; line-height: 17px; color: var(--text-2); text-wrap: pretty; }
.empty-note .food__icon { width: 46px; height: 46px; flex: none; border-radius: 12px; }
.chip--none { --chip: var(--text-3); color: var(--text-1); font-weight: 500; }   /* text-1: text-2 fell to 4.2:1 where the pane scrolls over the dark wave */

/* History: the calendar is the heatmap. Each logged day is tinted by how far it was from maintenance, blue under,
   orange over, deeper the further off. Day numbers sit on the tint, so the tints stop where text-1 still passes. */
.heat__dow, .heat__grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.heat__dow { margin: 0 0 8px; font-size: 12px; font-weight: 600; line-height: 15px; text-align: center; color: var(--text-2); }
.heat__grid { list-style: none; margin: 0; padding: 0; }
.heat__day { position: relative; min-width: 0; aspect-ratio: 1.12; border-radius: 12px; padding: 8px 10px 10px; display: flex; flex-direction: column; justify-content: space-between; color: var(--cell-text); font-variant-numeric: tabular-nums; }
/* not logged, or still to come: a faint cell, no numbers, so only the logged days carry text */
.heat__day.is-empty { background: none; color: var(--text-2); }   /* not logged: no fill, so the wallpaper can't read as a value */
.heat__day.is-before::after { content: ""; position: absolute; left: 50%; top: calc(50% + 6px); width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--text-3); }   /* before logging started: a faint dot */
.heat__day.is-missed { border: 1.5px dashed color-mix(in srgb, var(--text-2) 55%, transparent); }   /* a day missed: dashed */
.heat__day.is-future { box-shadow: inset 0 0 0 1px var(--sep); }   /* still to come: a hairline */
.heat__day.is-today.is-logged { color: var(--cell-text); }   /* today: its tint, the ring says it's still going */
/* the desktop sheet: the column fills the pane (its edges line up with the footer text), the squares are exactly
   square and sized from the width alone, so the same window gives the same squares however much is logged. More
   weeks than the height holds: the pane scrolls, it never squeezes sideways. Any height left over stays glass. */
.view.hist.is-fit { min-height: 0; grid-template-rows: none; row-gap: 16px; }
.view.hist.is-fit .day { margin-bottom: -6px; }
.view.hist.is-fit .heat__grid { max-width: calc(7 * 120px + 48px); }
.view.hist.is-fit .heat__dow { max-width: calc(7 * 120px + 48px); }
.view.hist.is-fit .heat__day { aspect-ratio: 1; padding: 7px 8px 8px; container: cell / inline-size; }
.view.hist.is-fit .heat__date { font-size: clamp(11px, 14cqi, 13px); line-height: 1.2; }
.view.hist.is-fit .heat__kcal { font-size: clamp(11px, 22cqi, 22px); }
.view.hist.is-fit .hist-key { margin-top: 12px; }
@container cell (max-width: 48px) { .heat__day .heat__mon { display: none; } }
/* the full number wherever it fits (a pane scrollbar can tip the pane under the phone width, so say it here) */
.view.hist.is-fit :is(.heat__dow, .heat__grid) { gap: 8px; }
.view.hist.is-fit .heat__kcal .k-full { display: inline; }
.view.hist.is-fit .heat__kcal .k-short { display: none; }
@container cell (max-width: 30px) {   /* "k" only where the full number can't fit (the inside of the square) */
  .view.hist.is-fit .heat__day .heat__kcal .k-full { display: none; }
  .view.hist.is-fit .heat__day .heat__kcal .k-short { display: inline; }
}
.heat__day.is-logged { background: color-mix(in srgb, var(--hue) calc(var(--heat-min) + var(--t) * var(--heat-range)), var(--cell-base)); box-shadow: inset 0 .5px 0 rgba(255,255,255,.4); animation: fade-in 420ms var(--ease-snap) both; animation-delay: calc(var(--i) * 22ms); }
.heat__day.is-over { --hue: var(--cell-over); }
.heat__day.is-under { --hue: var(--cell-under); }
.heat__day.is-today { color: var(--text-1); box-shadow: inset 0 0 0 var(--today-w, 2px) var(--today-ring, rgba(0, 0, 0, .5)); }   /* light: a firm ring, not the heaviest line on the sheet */
.heat__day.is-empty.is-today { color: var(--text-2); box-shadow: inset 0 0 0 2px var(--text-2); }   /* today, nothing logged yet */
/* a logged square is a link to that day: the link lies over the whole square */
.heat__go { position: absolute; inset: 0; border-radius: inherit; cursor: pointer; transition: box-shadow 160ms var(--ease-snap), background-color 160ms var(--ease-snap); }
.heat__go:hover { background: color-mix(in srgb, var(--text-1) 8%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--text-1) 45%, transparent); }
.heat__go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.heat__go:active { background: color-mix(in srgb, var(--text-1) 16%, transparent); }
.heat__date { font-size: 13px; font-weight: 600; line-height: 16px; white-space: nowrap; overflow: hidden; }
.heat__kcal .k-short { display: none; }
.heat__kcal { font-size: clamp(15px, 2.6cqi, 22px); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; white-space: nowrap; }
.hist-key { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 16px; font-size: 12px; line-height: 15px; color: var(--text-2); }
.hist-key__scale { display: flex; align-items: center; gap: 8px; }
.hist-key__bar { position: relative; width: 140px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, color-mix(in srgb, var(--cell-under) calc(var(--heat-min) + var(--heat-range)), var(--cell-base)), color-mix(in srgb, var(--cell-under) var(--heat-min), var(--cell-base)) 49%, color-mix(in srgb, var(--cell-over) var(--heat-min), var(--cell-base)) 51%, color-mix(in srgb, var(--cell-over) calc(var(--heat-min) + var(--heat-range)), var(--cell-base))); }
.hist-key__bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1.5px; margin-left: -.75px; border-radius: 1px; background: var(--text-2); }
.hist-key .legend { gap: 6px 14px; }

.stats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 12px; container: stats / inline-size; }
.stat { display: flex; flex-direction: column; padding: 12px 14px 13px; }
.stat__top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; line-height: 15px; color: var(--text-2); white-space: nowrap; }
.stat .big { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 4px; margin-top: 6px; font-size: clamp(24px, 2.4cqi, 32px); line-height: 1.15; }   /* smaller than the heatmap's pull, on purpose; one size for all four */
.stat .big small { margin: 0; font-size: 13px; line-height: 16px; }
.stat .big.is-none { font-size: 17px; line-height: 1.4; letter-spacing: -0.01em; white-space: normal; text-wrap: balance; padding-block: 3px; }   /* nothing to show yet: words, at the number's height */   /* the unit drops under the number when the card is too narrow for both */

.stat__sub { margin-top: 2px; font-size: 12px; line-height: 15px; color: var(--text-2); text-wrap: balance; }
/* History's trend: one dot a logged day, a line through them, maintenance dashed, today hollow (it's still going).
   Dots and labels are HTML over a stretched SVG, like Weight, so the text never scales with the chart. */
.hist-trend { display: flex; flex-direction: column; padding-bottom: 12px; }
.trend { position: relative; height: 150px; }
.view.hist.is-fit .trend { height: calc(150px - var(--hist-trim, 0px)); }   /* a near miss (under 40px) comes off the chart, not a scroll */
.pane__scroll.is-more { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }   /* History runs on below: the fold fades, it doesn't cut */
.trend__plot { position: absolute; inset: 10px 54px 24px 40px; }
.trend__grid { position: absolute; left: 0; right: 0; bottom: var(--y); border-top: 1px solid var(--sep); pointer-events: none; }
.trend__tick { position: absolute; right: 100%; bottom: var(--y); margin: 0 8px -7px 0; font-size: 11px; line-height: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (prefers-color-scheme: dark) { .view.hist .card { --text-2: rgba(255, 255, 255, .74); } }   /* the wallpaper streak can sit right behind the History cards at 2560; this keeps their small text at 4.5:1 */
.trend__plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.trend__area { fill: url(#trendFill); animation: fade-in 600ms var(--ease-snap) both; animation-delay: 200ms; }
.trend-fill-a { stop-color: var(--text-1); stop-opacity: .1; }
.trend-fill-b { stop-color: var(--text-1); stop-opacity: 0; }
.trend__line { fill: none; stroke: var(--text-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.trend__maint { position: absolute; left: 0; right: 0; bottom: var(--y); border-top: 1.5px dashed var(--text-2); pointer-events: none; }
.trend__tag { position: absolute; left: 100%; bottom: var(--y); margin: 0 0 -8px 18px; font-size: 12px; font-weight: 600; line-height: 15px; font-variant-numeric: tabular-nums; }
.trend__dot { position: absolute; left: var(--x); bottom: var(--y); width: 10px; height: 10px; margin: 0 0 -5px -5px; border-radius: 50%; background: var(--hue); box-shadow: 0 0 0 2px var(--badge-ring); animation: fade-in 400ms var(--ease-snap) both; animation-delay: calc(200ms + var(--i) * 25ms); }
.trend__dot.is-under { --hue: var(--heat-under); }
.trend__dot.is-over { --hue: var(--heat-over); }
.trend__dot.is-today { width: 16px; height: 16px; margin: 0 0 -8px -8px; background: var(--badge-ring); box-shadow: inset 0 0 0 3.5px var(--hue), 0 0 0 2px var(--badge-ring), 0 0 0 8px color-mix(in srgb, var(--hue) 22%, transparent); }
.trend__x small { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--text-2); }
.trend__x { position: absolute; left: var(--x); top: 100%; margin-top: 9px; font-size: 12px; line-height: 15px; color: var(--text-2); white-space: nowrap; }
.trend__x.is-end { transform: translateX(-100%); font-weight: 600; color: var(--text-1); }
.pips { display: flex; gap: 3px; margin-top: 8px; }
.pip { flex: 1; min-width: 0; height: 10px; border-radius: 5px; background: var(--k, var(--ring-track)); }

/* Weight: the number huge, the line under it (weekly weigh-ins), the next Sunday dashed. Points and labels are
   HTML laid over a stretched SVG, so the text never scales with the chart. */
.wt-now { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; }
.wt-now__num { font-size: clamp(60px, 13cqi, 104px); font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wt-now__num small { margin-left: 8px; font-size: .3em; font-weight: 600; letter-spacing: 0; color: var(--text-2); }
.wt-now__meta { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 16px; color: var(--text-2); }
.wt-chart { position: relative; height: clamp(204px, 26cqi, 250px); margin: 16px 0 40px; }
.wt-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.wt-area { fill: url(#wtFill); animation: fade-in 600ms var(--ease-snap) both; animation-delay: 200ms; }
.wt-fill-a { stop-color: var(--c-weight); stop-opacity: .34; }
.wt-fill-b { stop-color: var(--c-weight); stop-opacity: 0; }
.wt-line { fill: none; stroke: var(--c-weight); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.wt-grid { stroke: var(--sep); stroke-width: 1; vector-effect: non-scaling-stroke; }
.wt-next { stroke: var(--tick-ring); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
.wt-tick { position: absolute; right: 0; bottom: var(--y); margin-bottom: 3px; font-size: 11px; font-weight: 500; line-height: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.wt-dot { position: absolute; left: var(--x); bottom: var(--y); width: 12px; height: 12px; margin: 0 0 -6px -6px; border-radius: 50%; background: var(--c-weight); box-shadow: 0 0 0 3px var(--badge-ring); animation: fade-in 400ms var(--ease-snap) both; animation-delay: calc(250ms + var(--i) * 60ms); }
.wt-dot.is-latest { width: 18px; height: 18px; margin: 0 0 -9px -9px; box-shadow: 0 0 0 3px var(--badge-ring), 0 0 0 10px color-mix(in srgb, var(--c-weight) 24%, transparent); }
.wt-val { position: absolute; left: var(--x); bottom: var(--y); margin-bottom: 14px; transform: translateX(-50%); font-size: 13px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; animation: fade-in 400ms var(--ease-snap) both; animation-delay: calc(250ms + var(--i) * 60ms); }
.wt-val.is-latest { margin-bottom: 20px; font-size: 15px; font-weight: 700; }
.wt-x { position: absolute; left: var(--x); top: 100%; margin-top: 9px; transform: translateX(-50%); font-size: 12px; line-height: 15px; color: var(--text-2); white-space: nowrap; }
.wt-x.is-next { font-weight: 600; text-align: center; }
.wt-x.is-next small { display: block; font-size: 11px; font-weight: 500; line-height: 13px; }
/* empty History and Weight: Today's empty card (dashed, a picture built from the screen's own parts, one calm line) */
.day-empty--screen { padding: 32px 24px; }
/* History: a week of squares tinted like logged days, tilted like the meal icons, today outlined at the end */
.hist-pic { list-style: none; margin: 0 0 16px; padding: 0; display: flex; gap: 8px; }
.hist-pic li { flex: none; width: clamp(30px, calc((100vw - 120px) / 8), 42px); aspect-ratio: 1; border-radius: 11px; background: color-mix(in srgb, var(--hue) calc(var(--heat-min) + var(--t) * var(--heat-range)), var(--cell-base)); box-shadow: inset 0 .5px 0 rgba(255,255,255,.4), 0 2px 6px rgba(0,0,0,.10); }
.hist-pic li:nth-child(odd) { transform: rotate(-6deg); }
.hist-pic li:nth-child(even) { transform: translateY(-5px) rotate(5deg); }
.hist-pic .is-under { --hue: var(--cell-under); }
.hist-pic .is-over { --hue: var(--cell-over); }
.hist-pic .is-today { background: none; box-shadow: inset 0 0 0 2px var(--text-2); }
/* Weight: a little weigh-in line, then the dashed Sunday where the first real point goes */
.wt-pic { position: relative; width: min(260px, 100%); margin: 0 0 18px; }
.wt-pic svg { display: block; width: 100%; height: auto; overflow: visible; }
.wt-pic .wt-line { stroke-width: 2.5; }
.wt-pic__dot { fill: var(--c-weight); stroke: var(--badge-ring); stroke-width: 2.5; }
.wt-pic__next { fill: none; stroke: var(--c-weight); stroke-width: 2; stroke-dasharray: 3 3; }
.wt-pic__when { display: block; margin-top: 8px; text-align: right; font-size: 12px; font-weight: 600; line-height: 15px; color: var(--text-1); }
.wt-pic__when small { display: block; font-size: 11px; font-weight: 500; line-height: 13px; color: var(--text-2); }
/* no weigh-ins yet: the scale, a line about Sunday, and the empty chart waiting for its first point */
.wt-first { display: flex; align-items: center; gap: 14px; }
.wt-first .sq--lg { width: 52px; height: 52px; border-radius: 13px; font-size: 30px; }
.wt-first__title { display: block; font-size: 22px; font-weight: 700; line-height: 26px; letter-spacing: -0.01em; color: var(--text-1); }
.wt-first__text { display: block; margin-top: 3px; font-size: 13px; line-height: 17px; color: var(--text-2); }

.wt-grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.wt-maint__top { display: flex; align-items: center; gap: 12px; }
.wt-maint .pips { gap: 3px; margin-top: 14px; }
.pips__labels { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 12px; line-height: 15px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.pips__labels b { font-weight: 600; color: var(--text-1); }
/* change each week: bars from a zero line, up for a gain, down for a loss */
.chg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); column-gap: 14px; height: 118px; margin-top: 4px; }
.chg__col { position: relative; }
.chg__bar { position: absolute; left: 50%; width: min(100%, 40px); margin-left: calc(min(100%, 40px) / -2); bottom: var(--z); height: var(--h); border-radius: 8px 8px 3px 3px; background: linear-gradient(color-mix(in srgb, var(--c-weight) 80%, #fff), var(--c-weight)); transform-origin: bottom; animation: fill-in 700ms var(--ease-sheet) both; animation-delay: calc(var(--i) * 60ms); }
.chg__col.is-down .chg__bar { bottom: auto; top: calc(100% - var(--z)); border-radius: 3px 3px 8px 8px; transform-origin: top; }
.chg__val { position: absolute; left: 0; right: 0; bottom: calc(var(--z) + var(--h) + 5px); text-align: center; font-size: 13px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chg__col.is-down .chg__val { bottom: auto; top: calc(100% - var(--z) + var(--h) + 5px); }
.chg__zero { position: absolute; left: 0; right: 0; bottom: var(--z); height: 1px; background: var(--sep); }
.chg__x { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); column-gap: 14px; margin-top: 7px; font-size: 12px; line-height: 15px; text-align: center; color: var(--text-2); white-space: nowrap; }

/* a tall pane: each screen fills it like Today. The hero (the week's bars, the heatmap, the weight line, or the empty
   card) takes the spare height; the title and the cards under it keep theirs. At 1440x900 there's little to spare. */
@container pane (min-width: 600px) {
  .view { min-height: calc(var(--pane-h, 0px) - 8px); grid-template-rows: auto minmax(0, 1fr) auto; }
  :is(.wk-chart, .wk-chart > [role="img"], .hist-hero, .wt-hero):not([hidden]) { display: flex; flex-direction: column; }
  .wk-chart > [role="img"] { flex: 1 0 auto; }
  .wk-chart__plot { flex: 1 0 auto; height: auto; min-height: clamp(160px, 20cqi, 270px); }
  .wt-chart { flex: 1 0 auto; height: auto; min-height: clamp(204px, 26cqi, 250px); }
  :is(.hist-hero, .wt-hero) > .day-empty { flex: 1 0 auto; align-content: center; }
}

@container stats (max-width: 599px) {
  .stats > .stat { grid-column: span 2; }   /* two by two in a narrow row, so the names and icons keep one line */
}
@container pane (max-width: 599px) {
  .wk-grid { grid-template-columns: minmax(0, 1fr); }
  .wt-grid2 { grid-template-columns: minmax(0, 1fr); }
}
@container pane (max-width: 660px) {
  .heat__day { border-radius: 12px; padding: 6px 6px 8px 8px; }
  .heat__date { font-size: 12px; line-height: 14px; }
  .heat__mon { display: none; }   /* no room for "26 Oct" here: the subtitle gives the dates */
  .heat__kcal { font-size: 14px; letter-spacing: -0.02em; }
}
@container pane (max-width: 459px) {
  .wk-chart { --gut: 40px; --gap: 8px; }
  .wk-col__val { font-size: 11px; line-height: 14px; letter-spacing: -0.01em; }
  .wk-line__tag { font-size: 11px; }
  .wk-chart__days b { font-size: 11px; letter-spacing: -0.01em; }
  .wk-chart__days .is-today b { padding: 0 4px; }
  .heat__dow, .heat__grid { gap: 4px; }
  .heat__dow { font-size: 11px; }
  .heat__day { aspect-ratio: 1; border-radius: 10px; padding: 4px 4px 6px; }
  .heat__kcal .k-full { display: none; }
  .heat__kcal .k-short { display: inline; }
  .heat__date { font-size: 11px; line-height: 13px; }
  .heat__kcal { font-size: 12px; letter-spacing: -0.02em; }
}

/* footer bar (ref 12's hint line; no button, Claude does the logging) */
.pane__foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 52px;
  margin: 0 10px;
  padding: 0 4px 0 8px;
  border-top: .5px solid var(--sep);
  font-size: 12px;
  color: var(--text-2);
}
.pane__hint { min-width: 0; line-height: 15px; text-wrap: pretty; }

/* ---------- Control Center (refs 6, 13) ---------- */
.cc {
  position: absolute;
  top: var(--top-gap);
  right: var(--cc-right);
  width: var(--cc-w);
  display: grid;
  grid-template-columns: repeat(4, 63px);
  grid-auto-rows: 63px;               /* rows as needed: with a module hidden, Control Center ends at the last one */
  gap: 12px;
  color: var(--cc-text);
}
.cc-mod {
  background: var(--cc-bg);
  -webkit-backdrop-filter: var(--cc-blur);
  backdrop-filter: var(--cc-blur);
  box-shadow: var(--cc-shadow), inset 0 0 16px rgba(255,255,255,.14);
  transition: transform 160ms var(--ease-snap);
}
.cc-mod:active { transform: scale(.97); }
.cc-mod.rim::after { padding: 1.2px; background: linear-gradient(135deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 26%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.35) 74%, rgba(255,255,255,.9) 100%); }
@media (prefers-color-scheme: dark) {
  .cc-mod.rim::after { background: linear-gradient(135deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.12) 26%, rgba(255,255,255,.04) 50%, rgba(255,255,255,.12) 74%, rgba(255,255,255,.4) 100%); }
}

/* pill toggles (Wi-Fi / Focus) */
.cc-pill {
  grid-column: span 2;
  border-radius: 999px;
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 9px;
  text-align: left;
}
.cc-pill__icon {
  width: 42px; height: 42px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--cc-off);
  color: var(--cc-text);
  font-size: 20px;
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.35);
}
.cc-pill.is-on .cc-pill__icon { background: var(--cc-on); color: var(--cc-on-fg); }
.cc-pill__text { min-width: 0; }
.cc-pill__title { font-size: 13px; font-weight: 600; white-space: nowrap; }
.cc-pill__sub { margin-top: 1px; font-size: 12px; color: var(--cc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* module labels laid out like Up Next: a glyph in a circle, the label beside it */
.cc-next__top { display: flex; align-items: center; gap: 8px; }
.cc-next__icon {
  width: 32px; height: 32px;
  flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--cc-off);
  font-size: 19px;
  box-shadow: inset 0 .5px 0 rgba(255,255,255,.35);
}
.cc-next__label { font-size: 11px; font-weight: 600; letter-spacing: .01em; color: var(--cc-text-2); }
.cc-next__meta { margin-top: 2px; font-size: 12px; line-height: 15px; color: var(--cc-text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the number a module is about, its unit at label size */
.cc-stat { margin-top: auto; font-size: 20px; font-weight: 600; line-height: 24px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cc-stat small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--cc-text-2); }
/* every module here is read-only, so none has a press state */
section.cc-mod:active { transform: none; }

/* wide modules, like Display and Sound (ref 13): a title row, then the content across the full width */
.cc-wide {
  grid-column: 1 / -1;
  grid-row: span 2;
  min-width: 0;
  border-radius: 30px;
  padding: 13px 16px 14px;
  display: flex; flex-direction: column;
}
.cc-wide__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cc-wide__title { margin: 0; font-size: 13px; font-weight: 600; line-height: 16px; }
.cc-wide__aside { font-size: 12px; line-height: 15px; color: var(--cc-text-2); white-space: nowrap; }
.cc-wide__aside b { font-weight: 600; color: var(--cc-text); font-variant-numeric: tabular-nums; }

/* Last 7 days: a 4x3 module, smaller than the day's ring. Bars from zero, the maintenance line behind them, today outlined because the
   day isn't over, each day's kcal above its name. Scale: the top of the plot is 2,800 kcal. */
.cc-week { grid-row: span 3; padding-bottom: 12px; }
.cc-chart { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 8px; }
.cc-chart__plot {
  position: relative;
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); column-gap: 7px;
  align-items: end;
  box-shadow: 0 1px 0 var(--cc-track);
}
.cc-chart__bar { position: relative; z-index: 1; justify-self: center; width: min(100%, 24px); height: var(--h); border-radius: 6px 6px 2px 2px; background: var(--cc-on); }
.cc-chart__bar.is-partial { background: var(--cc-track); box-shadow: inset 0 0 0 1.5px var(--cc-on); }
.cc-chart__bar.is-none { visibility: hidden; }   /* not logged: no bar, a dash under it (not 0 kcal) */
.cc-chart__bar.is-ghost { background: none; border: 1.5px dashed var(--cc-text-2); border-bottom: 0; opacity: .7; }   /* nothing logged yet: where the bars will go */
.cc-chart__line { position: absolute; left: 0; right: 0; bottom: var(--y); height: 1.5px; background: repeating-linear-gradient(90deg, var(--cc-text-2) 0 4px, transparent 4px 7px); }
.cc-chart__line-label { position: absolute; right: 0; bottom: 5px; font-size: 11px; font-weight: 600; line-height: 13px; color: var(--cc-text-2); font-variant-numeric: tabular-nums; }
.cc-chart__days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: 7px; margin-top: 6px; font-size: 11px; font-weight: 500; line-height: 13px; text-align: center; color: var(--cc-text-2); }
.cc-chart__days b { display: block; margin-bottom: 1px; font-weight: 600; color: var(--cc-text); letter-spacing: -0.01em; white-space: nowrap; }   /* proportional figures: narrower, so neighbours don't touch */
.cc-chart__days .is-today { font-weight: 700; color: var(--cc-text); }

/* Weight: the number on the left, a sparkline of the weigh-ins so far on the right, then a dashed mark for Sunday */
.cc-weight { flex-direction: row; align-items: stretch; gap: 14px; }
.cc-weight__info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cc-weight__info .cc-stat { margin-top: auto; }
.cc-spark { flex: none; width: 108px; display: flex; flex-direction: column; justify-content: flex-end; }
.cc-spark svg { width: 100%; height: auto; display: block; overflow: visible; }
.cc-spark__area { fill: url(#sparkFill); }
.cc-spark__line { fill: none; stroke: var(--cc-on); stroke-width: 2.4; stroke-linecap: round; }
.cc-spark__dot { fill: var(--cc-on); }
.cc-spark__halo { fill: var(--cc-track); }
.cc-spark__next { stroke: var(--cc-text-2); stroke-width: 1.5; stroke-dasharray: 3 3; stroke-linecap: round; }
.cc-spark__ahead { fill: none; stroke: var(--cc-text-2); stroke-width: 2; stroke-dasharray: 3 4; stroke-linecap: round; stroke-linejoin: round; }   /* on to the next weigh-in */
.cc-spark__slot { fill: none; stroke: var(--cc-on); stroke-width: 1.8; stroke-dasharray: 2.6 2.6; }
.cc-spark__days { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; font-weight: 500; line-height: 13px; color: var(--cc-text-2); white-space: nowrap; }

/* Maintenance: a full-width pill, its note on two lines */
.cc-maint { grid-column: 1 / -1; padding-right: 16px; }
.cc-maint .cc-pill__icon { font-size: 22px; }
.cc-maint .cc-pill__sub { white-space: normal; line-height: 15px; text-wrap: balance; }

/* ---------- Dock (refs 9, 10, 11, 12) ---------- */
.dock {
  position: fixed;
  left: 50%;
  bottom: 6px;
  z-index: 15;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 7px;
  padding: 7px 9px;
  border-radius: 26px;
  background: var(--dock-bg);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  box-shadow: 0 10px 30px rgba(10, 30, 80, .18), inset 0 1px 0 rgba(255,255,255,.35);
  list-style: none;
  margin: 0;
}
.dock__item { position: relative; }
.dock__btn { display: block; position: relative; transition: transform 200ms var(--ease-snap); }
.dock__btn:hover, .dock__btn:focus-visible { transform: translateY(-4px); }
.dock__btn:active { transform: translateY(-4px) scale(.97); }
/* app-style icons: list-colour gradient, top gloss, rim, filled glyph with its own shading */
.app-icon {
  --c: var(--c-all);
  width: 54px; height: 54px;
  border-radius: 12.5px;
  display: grid; place-items: center;
  overflow: hidden;
  background:
    radial-gradient(130% 72% at 50% -10%, rgba(255,255,255,.46), rgba(255,255,255,0) 60%),
    linear-gradient(165deg, color-mix(in srgb, var(--c) 68%, #fff) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 76%, #000) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1.5px 0 rgba(0,0,0,.14), inset 0 0 0 .5px rgba(255,255,255,.22), 0 3px 8px rgba(0,0,0,.20), 0 1px 2px rgba(0,0,0,.10);
}
.app-icon svg { width: 78%; height: 78%; overflow: visible; filter: drop-shadow(0 1.6px 1.2px rgba(0,0,0,.24)); }
.app-icon .g-main { fill: url(#glyphLight); }
.app-icon .g-sub { fill: rgba(255,255,255,.62); }
.app-icon .g-line { fill: none; stroke: url(#glyphLight); stroke-width: 2.8; stroke-linecap: round; }
/* meal glyphs: cup (breakfast), sandwich with its filling (lunch), apple (snacks), plate and cutlery (dinner) */
.app-icon .g-steam { fill: none; stroke: rgba(255,255,255,.72); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.app-icon .g-cut { fill: none; stroke: url(#glyphLight); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.app-icon .plate-rim { fill: none; stroke: color-mix(in srgb, var(--c) 40%, #fff); stroke-width: 1.4; }
.app-icon .sand-in { fill: #fff2d2; }   /* the crumb inside the crust */
.app-icon--breakfast { --c: var(--c-breakfast); }
.app-icon--lunch { --c: var(--c-lunch); }
.app-icon--snacks { --c: var(--c-snacks); }
.app-icon--dinner { --c: var(--c-dinner); }
.app-icon--drinks { --c: var(--c-drinks); }
.app-icon--home { --c: #2f6fe0; }   /* back to the Home desktop (jamieh06.github.io/home) */
.dock__sep { width: 1px; height: 46px; margin: 0 5px; background: var(--dock-sep); list-style: none; }
@media (max-width: 640px) { .dock__sep { height: 30px; margin: 0 3px; } }
.app-icon .g-tint { fill: color-mix(in srgb, var(--c) 42%, #fff); }   /* the drink in the glass */
.dock__badge {
  position: absolute;
  top: -5px; right: -6px;
  min-width: 19px; height: 19px;
  padding: 0 5px;
  display: grid; place-items: center;
  border-radius: 10px;
  font-size: 11px; font-weight: 600; line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--badge-text);
  background: var(--badge-bg);
  box-shadow: 0 1px 3px rgba(0,0,0,.18), inset 0 0 0 .5px var(--badge-rim);
  pointer-events: none;
}
body:not([data-view="today"]) .dock__badge { display: none; }
.dock__label {
  position: absolute;
  left: 50%; bottom: calc(100% + 16px);
  transform: translateX(-50%) translateY(4px);
  padding: 4px 10px;
  border-radius: 9px;
  font-size: 13px;
  white-space: nowrap;
  color: var(--text-1);
  background: var(--dock-bg);   /* no blur of its own: inside the Dock's glass it had nothing to blur (the Dock is its
                                   backdrop root), so the plain tint looks exactly the same */
  box-shadow: 0 4px 14px rgba(0,0,0,.14), inset 0 0 0 .5px rgba(255,255,255,.4);
  opacity: 0;
  pointer-events: none;
  transition: opacity 150ms var(--ease-snap), transform 150ms var(--ease-snap);
}
.dock__item:hover .dock__label, .dock__btn:focus-visible + .dock__label { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-color-scheme: dark) {
  /* dark tint (ref 10): smoked squircles, glyphs tinted in each meal colour */
  .app-icon {
    background: radial-gradient(130% 72% at 50% -10%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%), linear-gradient(165deg, #3b3d4a 0%, #24262f 55%, #16171e 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.24), inset 0 0 0 .5px rgba(255,255,255,.10), 0 3px 8px rgba(0,0,0,.42);
  }
  .app-icon svg { filter: drop-shadow(0 0 5px color-mix(in srgb, var(--c) 40%, transparent)); }
  .app-icon .g-main { fill: var(--c); }
  .app-icon .g-sub { fill: color-mix(in srgb, var(--c) 48%, transparent); }
  .app-icon .g-line, .app-icon .g-cut { stroke: var(--c); }
  .app-icon .g-steam { stroke: color-mix(in srgb, var(--c) 60%, transparent); }
  .app-icon .plate-rim { stroke: #1b1c22; }
  .app-icon .sand-in { fill: color-mix(in srgb, var(--c) 30%, #fff2d2); }
  .app-icon .g-tint { fill: color-mix(in srgb, var(--c) 40%, transparent); }
}
@media (prefers-color-scheme: dark) {
  /* the food pictures join the same family: smoked squircle, glyph in the food's colour (empty plates keep their own tint) */
  .food__icon:not(.food__icon--empty) {
    background: radial-gradient(130% 72% at 50% -10%, rgba(255,255,255,.16), rgba(255,255,255,0) 60%), linear-gradient(165deg, #3b3d4a 0%, #24262f 55%, #16171e 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.10), 0 1px 3px rgba(0,0,0,.40);
  }
  .food__icon:not(.food__icon--empty) svg { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--f) 38%, transparent)); }
  .food__icon:not(.food__icon--empty) .g-main { fill: var(--f); }
  .food__icon:not(.food__icon--empty) .g-sub { fill: color-mix(in srgb, var(--f) 50%, transparent); }
  .food__icon:not(.food__icon--empty) .g-in { fill: color-mix(in srgb, var(--f) 45%, #fff); }
  .food__icon:not(.food__icon--empty) .g-cut { stroke: color-mix(in srgb, var(--f) 30%, #15161c); }
  .food__icon:not(.food__icon--empty) .g-line { stroke: var(--f); }
  .food__icon:not(.food__icon--empty) .g-steam { stroke: color-mix(in srgb, var(--f) 60%, transparent); }
  .food__icon:not(.food__icon--empty) .g-stem { stroke: var(--f); }
  .food__icon--can .g-stem { stroke: color-mix(in srgb, var(--f) 30%, #15161c); }   /* the wave sits on the label */
  .food__icon:not(.food__icon--empty) .g-tag { fill: color-mix(in srgb, var(--f) 45%, #fff); }
  .food__icon:not(.food__icon--empty) .plate-rim { stroke: #1b1c22; }
  .food__icon:not(.food__icon--empty) .g-crumb { fill: color-mix(in srgb, var(--f) 30%, #fff2d2); }
}

/* ---------- account: a quiet status in the footer, its menu, and the Sign In sheet ----------
   The sheet is the Edit Controls glass from the To Do app (live blur: it's a dialog, it moves). */
:root {
  --panel-bg: rgba(248, 250, 254, .74);
  --panel-rim: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.25);
  --chip-bg: rgba(0, 0, 0, .055);
  --dt-bg: rgba(255, 255, 255, .22);
  --signin-bg: var(--sheet-bg);   /* the day sheet's own glass */
  --dt-shadow: 0 8px 32px rgba(0, 0, 0, .18);
  --dt-spec: rgba(255, 255, 255, .55);
  --dt-tile: rgba(255, 255, 255, .58);
  --dt-tile-rim: inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 .5px rgba(255,255,255,.16);
  --dt-on-tile: var(--text-1);
  --dt-on-tile-2: var(--dt-text-2);
  --dt-text-2: rgba(0, 0, 0, .72);   /* the Sign In sheet floats over Control Center too: a notch above --text-2 keeps 5:1 there */
  --dt-red: color-mix(in srgb, var(--red) 52%, #000);
  --dt-glow: 0 0 0 3px color-mix(in srgb, var(--accent) 38%, transparent);
  --accent-fill: color-mix(in srgb, var(--accent) 86%, #000);   /* white text on it stays above 4.5:1 */
  --on-accent: #fff;
  --done-shadow: 0 1px 3px rgba(0, 60, 160, .20);
}
@media (prefers-color-scheme: dark) {
  :root {
    --panel-bg: rgba(40, 42, 54, .74);
    --panel-rim: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.10);
    --chip-bg: rgba(255, 255, 255, .08);
    --dt-bg: rgba(30, 30, 34, .40);
    --dt-shadow: 0 8px 32px rgba(0, 0, 0, .35);
    --dt-spec: rgba(255, 255, 255, .18);
    --dt-tile: rgba(255, 255, 255, .09);
    --dt-tile-rim: inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.10);
    --dt-text-2: rgba(255, 255, 255, .72);
    --dt-red: color-mix(in srgb, var(--red) 62%, #fff);
    --accent-fill: color-mix(in srgb, var(--accent) 80%, #000);
    --done-shadow: 0 1px 3px rgba(0, 0, 0, .30);
  }
}

.pane__foot { position: relative; }
.acct {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  height: 28px; padding: 0 10px 0 9px; border-radius: 14px;
  font-size: 12px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: background-color 150ms var(--ease-snap);
}
.acct:hover, .acct[aria-expanded="true"] { background: var(--hover); }
.acct__dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--dot, var(--c-all)); }
.acct[data-state="ok"], .acct[data-state="busy"] { --dot: var(--c-lunch); }
.acct[data-state="offline"], .acct[data-state="error"] { --dot: var(--orange); }
/* signed out: a filled pill, white on the accent fill (5.2:1 in both modes), so it never depends on the glass behind it */
.acct[data-state="off"] { --dot: #fff; padding: 0 12px 0 10px; color: var(--on-accent); font-weight: 600; background: var(--accent-fill); box-shadow: inset 0 1px 0 rgba(255,255,255,.24), var(--done-shadow); }
.acct[data-state="off"]:hover { background: color-mix(in srgb, var(--accent-fill) 88%, #000); }
.acct[data-state="seed"] { --dot: var(--c-breakfast); }

.acct-menu {
  position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 20;
  width: 264px; padding: 14px 14px 12px; border-radius: 20px;
  background: var(--panel-bg);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  backdrop-filter: blur(30px) saturate(180%);
  box-shadow: 0 8px 32px rgba(0, 0, 0, .18), var(--panel-rim);
  transform-origin: 100% 100%;
  opacity: 0; transform: translateY(4px) scale(.96);
  transition: opacity 180ms var(--ease-snap), transform 180ms var(--ease-snap);
}
.acct-menu.is-open { opacity: 1; transform: none; }
.acct-menu__who { margin: 0; font-size: 12px; line-height: 15px; color: var(--text-2); }
