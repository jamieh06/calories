.acct-menu__who b { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; line-height: 17px; color: var(--text-1); overflow-wrap: anywhere; }
.acct-menu__when { margin: 8px 0 0; padding-top: 8px; border-top: .5px solid var(--sep); font-size: 12px; line-height: 16px; color: var(--text-2); }
.acct-menu__row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.acct-menu__btn { position: relative; height: 30px; padding: 0 14px; border-radius: 15px; font-size: 13px; font-weight: 500; background: var(--chip-bg); transition: transform 140ms var(--ease-snap); }
.acct-menu__btn--out { color: var(--red-text); }
.acct-menu__btn:active { transform: scale(.97); }

.signin {
  position: fixed; inset: 0 auto; top: 0; bottom: 0;
  left: calc((100vw - 300px) / 2 - 210px);   /* centred over the day sheet, left of Control Center */
  width: 420px; height: fit-content; max-width: none; max-height: none;
  margin: auto 0; padding: 0; border: 0;
  background: none; color: var(--text-1); overflow: visible;
}
/* the page behind goes soft and a little dim, so the ring's big number doesn't show sharp round the sheet */
.signin::backdrop { background: rgba(12, 30, 70, .16); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); opacity: 0; transition: opacity 300ms var(--ease-sheet); }
.signin.is-in::backdrop { opacity: 1; }
@media (prefers-color-scheme: dark) { .signin::backdrop { background: rgba(0, 0, 0, .32); } }
.signin__glass {
  display: block; border-radius: 26px;
  background: var(--signin-bg);
  -webkit-backdrop-filter: blur(34px) saturate(165%);
  backdrop-filter: blur(34px) saturate(165%);
  box-shadow: var(--sheet-shadow), inset 0 1px 0 var(--rim-b), inset 0 0 0 .5px rgba(255,255,255,.18);
  transform-origin: 50% 30%;
  opacity: 0; transform: scale(.96);
  transition: opacity 340ms var(--ease-sheet), transform 340ms var(--ease-sheet);
}
.signin.is-in .signin__glass { opacity: 1; transform: none; }
.signin:not(.is-in) .signin__glass { transition-duration: 220ms; }   /* closing is quicker than opening */
.signin__head { display: flex; align-items: center; gap: 14px; padding: 24px 24px 6px; }
.signin__icon { width: 46px; height: 46px; flex: none; border-radius: 11px; --c: var(--c-today); }
.signin__icon .g-ring { fill: none; stroke: url(#glyphLight); stroke-width: 5; stroke-linecap: round; }
.signin__icon .g-ring--track { stroke: rgba(255,255,255,.34); }
@media (prefers-color-scheme: dark) { .signin__icon .g-ring { stroke: var(--c); } .signin__icon .g-ring--track { stroke: color-mix(in srgb, var(--c) 30%, transparent); } }
.signin__title { margin: 0; font-size: 22px; font-weight: 600; line-height: 26px; letter-spacing: -0.01em; }
.signin__lede { margin: 2px 0 0; font-size: 13px; line-height: 17px; color: var(--dt-text-2); }
.signin__body { padding: 12px 24px 4px; }
.signin__tile { padding: 2px 14px; border-radius: 22px; background: var(--dt-tile); box-shadow: var(--dt-tile-rim); color: var(--dt-on-tile); }   /* no glow round it when a field has focus: the caret shows where you are */

<script>
/* Static glass. The wallpaper is drawn once into a canvas (no live SVG blur), and glass that sits still on it
   (the task sheet, Control Center's labels and Edit Controls) gets its blurred backdrop baked into an image
   at the same blur, so nothing re-blurs while the list scrolls. It looks the same; on a resize, a theme change,
   the stacked layout or reduced transparency the live backdrop-filter is used instead. */
const glass = (() => {
  const wp = document.querySelector('.wallpaper'), svg = wp?.querySelector('svg');
  if (!svg || !window.CanvasRenderingContext2D) return { refresh() {} };
  const desk = matchMedia('(min-width: 1024px) and (min-height: 620px)');
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const solid = matchMedia('(prefers-reduced-transparency: reduce)');
  const canFilter = 'filter' in CanvasRenderingContext2D.prototype;
  const SEL = '.sheet, .cc-sort__label, .cc-edit, .cc-mod, .dock';
  const rasters = {};                 // 'light' | 'dark' -> canvas, kept for the session
  let shown = null, job = 0, timer = 0;
  const urls = new Map();

  // the wallpaper SVG with its CSS colours written in, so it draws the same outside the page
  function svgText() {
    const copy = svg.cloneNode(true), src = svg.querySelectorAll('*'), dst = copy.querySelectorAll('*');
    src.forEach((el, i) => {
      if (!el.getAttribute('class')) return;
      const cs = getComputedStyle(el), d = dst[i];
      if (el.tagName === 'stop') d.setAttribute('stop-color', cs.stopColor);
      else { d.setAttribute('fill', cs.fill); d.setAttribute('stroke', cs.stroke); }
      d.removeAttribute('class');
    });
    return copy;
  }
  // big enough for this screen at this pixel density, so it is only ever scaled down (cover, centred = xMidYMid slice)
  function rasterScale() {
    const dpr = Math.min(devicePixelRatio || 1, 3);
    const s = Math.max(screen.width, innerWidth) / 1440, t = Math.max(screen.height, innerHeight) / 900;
    return Math.min(Math.max(s, t) * dpr, 4096 / 1440);
  }
  async function raster(scheme) {
    const k = rasterScale();
    if (rasters[scheme] && rasters[scheme]._k >= k - 0.01) return rasters[scheme];
    const copy = svgText(), W = Math.round(1440 * k), H = Math.round(900 * k);
    copy.setAttribute('width', W); copy.setAttribute('height', H);
    const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: 'image/svg+xml' }));
    try {
      const img = new Image(); img.src = url; await img.decode();
      const c = document.createElement('canvas'); c.width = W; c.height = H; c._k = k;
      c.className = 'wallpaper__raster'; c.setAttribute('aria-hidden', 'true');
      c.getContext('2d').drawImage(img, 0, 0, W, H);
      return (rasters[scheme] = c);
    } finally { URL.revokeObjectURL(url); }
  }
  // where a CSS pixel of the viewport lands on the raster (object-fit: cover, centred)
  function mapper(c) {
    const s = Math.max(innerWidth / 1440, innerHeight / 900), ox = (innerWidth - 1440 * s) / 2, oy = (innerHeight - 900 * s) / 2, r = c._k / s;
    return (x, y) => [(x - ox) * r, (y - oy) * r, r];
  }
  // backdrop-filter mirrors the backdrop at the element's edge; do the same so the edges match
  function bakeOne(el, c, f) {
    const b = el.getBoundingClientRect(), w = Math.round(b.width), h = Math.round(b.height);
    if (!w || !h) return null;
    const blur = +(/blur\(([\d.]+)px\)/.exec(f)?.[1] || 0), P = Math.ceil(blur * 3) + 2;
    const map = mapper(c), [sx, sy, r] = map(b.left, b.top);
    const src = document.createElement('canvas'); src.width = w + 2 * P; src.height = h + 2 * P;
    const g = src.getContext('2d');
    g.imageSmoothingQuality = 'high';
    const piece = (dx, dy, fx, fy) => { g.save(); g.translate(P + dx, P + dy); g.scale(fx, fy); g.drawImage(c, sx, sy, w * r, h * r, 0, 0, w, h); g.restore(); };
    piece(0, 0, 1, 1);
    piece(0, 0, -1, 1); piece(2 * w, 0, -1, 1); piece(0, 0, 1, -1); piece(0, 2 * h, 1, -1);
    piece(0, 0, -1, -1); piece(2 * w, 0, -1, -1); piece(0, 2 * h, -1, -1); piece(2 * w, 2 * h, -1, -1);
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const o = out.getContext('2d'); o.filter = f; o.drawImage(src, -P, -P);
    return out;
  }
  const on = () => desk.matches && !solid.matches && canFilter;
  // back to the live blur: always correct straight away, so dropping a bake never leaves a gap
  function clear() { document.querySelectorAll('.is-baking, .is-baked').forEach(el => el.classList.remove('is-baking', 'is-baked')); }
  async function refresh() {
    const my = ++job, scheme = dark.matches ? 'dark' : 'light';
    clear();
    let c;
    try { c = await raster(scheme); } catch { c = null; }
    if (my !== job) return;
    if (c && shown !== c) { shown?.remove(); wp.append(c); shown = c; }
    wp.classList.toggle('is-raster', !!c);
    if (!c || !on()) return;
    await new Promise(requestAnimationFrame);
    if (my !== job) return;
    const els = [...document.querySelectorAll(SEL)], jobs = [];
    for (const el of els) {
      const f = getComputedStyle(el).backdropFilter;
      if (!f || f === 'none') continue;
      try {   // a browser that taints the canvas just keeps the live blur
        const out = bakeOne(el, c, f);
        if (out) jobs.push(new Promise(res => out.toBlob(bl => res([el, bl]))));
      } catch { return; }
    }
    // decode every image before the page sees it, so the CSS background is ready on its first frame
    const done = await Promise.all((await Promise.all(jobs)).map(async ([el, bl]) => {
      if (!bl) return null;
      const u = URL.createObjectURL(bl), img = new Image();
      img.src = u;
      try { await img.decode(); } catch { URL.revokeObjectURL(u); return null; }
      return [el, u, img];
    }));
    const ready = done.filter(Boolean);
    const drop = () => ready.forEach(([, u]) => URL.revokeObjectURL(u));
    if (my !== job) return drop();
    for (const [el, u, img] of ready) {
      if (urls.has(el)) URL.revokeObjectURL(urls.get(el).u);
      urls.set(el, { u, img });               // the decoded image stays referenced while it's on screen
      el.style.setProperty('--baked', `url("${u}")`);
      el.classList.add('is-baking');           // baked image over the live blur: same look either way
    }
    // let the baked layer paint (two frames), then switch the live blur off underneath it
    await new Promise(requestAnimationFrame); await new Promise(requestAnimationFrame);
    if (my !== job) return;
    for (const [el] of ready) if (el.classList.contains('is-baking')) el.classList.add('is-baked');
  }
  const soon = () => { clear(); clearTimeout(timer); timer = setTimeout(refresh, 180); };
  addEventListener('resize', soon);
  for (const m of [desk, solid]) m.addEventListener('change', soon);
  // light <-> dark: back to the live SVG at once (its colours follow the theme), then draw the new one
  dark.addEventListener('change', () => { job++; wp.classList.remove('is-raster'); shown?.remove(); shown = null; soon(); });
  // a label that changes size would stretch its baked image: re-bake (the live blur covers the gap)
  const sizes = new WeakMap();
  const ro = new ResizeObserver(list => {
    let moved = false;
    for (const e of list) { const k = Math.round(e.contentRect.width) + 'x' + Math.round(e.contentRect.height); if (sizes.has(e.target) && sizes.get(e.target) !== k) moved = true; sizes.set(e.target, k); }
    if (moved) soon();
  });
  document.querySelectorAll(SEL).forEach(el => ro.observe(el));
  return { refresh, soon };
})();

/* ---------- the Dock: a meal icon shows where that meal is ---------- */
// Brings the meal's section into view (when the list has to scroll) and highlights it for a moment, opacity only.
(() => {
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const timers = new WeakMap();
  document.querySelector('.dock')?.addEventListener('click', e => {
    const sec = document.getElementById('meal-' + e.target.closest('[data-meal]')?.dataset.meal);
    if (!sec) return;
    sec.scrollIntoView({ behavior: still.matches ? 'auto' : 'smooth', block: 'nearest' });
    sec.classList.add('is-flash');
    clearTimeout(timers.get(sec));
    timers.set(sec, setTimeout(() => sec.classList.remove('is-flash'), 650));
  });
})();

/* ---------- the model: turns the rows into what each screen draws ----------
   raw = { food: calorie_food rows for the last 7 days, days: calorie_days rows (every logged day),
           weight: calorie_weight rows, settings: calorie_settings rows }.
   A day with no row in calorie_days isn't logged: it is left out of averages and counts (never 0 kcal). */
function macroSplit(p, c, f) {
  const cal = [p * 4, c * 4, f * 9], tot = cal[0] + cal[1] + cal[2];
  if (!(tot > 0)) return null;
  const pct = cal.map(v => Math.round(v / tot * 100));
  const off = 100 - pct[0] - pct[1] - pct[2];
  if (off) pct[pct.indexOf(Math.max(...pct))] += off;   // shares add up to 100
  return { protein: { g: Math.round(p), pct: pct[0] }, carbs: { g: Math.round(c), pct: pct[1] }, fat: { g: Math.round(f), pct: pct[2] } };
}
function buildModel(raw, today, viewDay = null) {
  if (!viewDay || viewDay >= today) viewDay = null;   // a past day picked in History; null is today
  const set = (raw.settings || [])[0];
  const setKcal = numOr(set && set.maintenance_kcal);
  const maint = setKcal || MAINT_DEFAULT, estimate = !setKcal;

  const days = new Map();
  for (const r of raw.days || []) {
    if (!r || !r.day || r.day > today) continue;
    days.set(r.day, {
      kcal: numOr(r.kcal, 0), p: numOr(r.protein_g, 0), c: numOr(r.carbs_g, 0), f: numOr(r.fat_g, 0),
      meals: Object.fromEntries(MEALS_ALL.map(m => [m, numOr(r[m + '_kcal'], 0)])),
    });
  }
  const loggedDays = [...days.keys()].sort();

  const weekFrom = addDays(today, -6);
  const foodRow = r => ({
    day: r.day,
    meal: MEALS_ALL.includes(r.meal) ? r.meal : 'snacks',
    time: r.eaten_at ? String(r.eaten_at).slice(0, 5) : '',          // REST gives "HH:MM:SS"
    name: String(r.name || 'Food').trim(), portion: r.portion ? String(r.portion).trim() : '',
    kcal: numOr(r.kcal, 0), p: numOr(r.protein_g), c: numOr(r.carbs_g), f: numOr(r.fat_g),
    source: r.source ? String(r.source).trim() : '', icon: iconKey(r.icon),
    notes: r.notes ? String(r.notes).trim() : '', created: String(r.created_at || ''),
  });
  const food = (raw.food || []).filter(r => r && r.day >= weekFrom && r.day <= today).map(foodRow);
  const byTime = (a, b) => (a.time ? 0 : 1) - (b.time ? 0 : 1) || a.time.localeCompare(b.time) || a.created.localeCompare(b.created);
  // the day on the Today screen: today, or the day picked in History. The week's food is already here; an older
  // day's comes with its own read (raw.dayFood), and until it lands the ring is drawn from that day's totals.
  const shown = viewDay || today;
  const older = viewDay && viewDay < weekFrom;
  const loading = older && !(raw.dayFood && raw.dayFood.day === viewDay);
  const todayFood = (older ? (loading ? [] : (raw.dayFood.rows || []).filter(r => r && r.day === viewDay).map(foodRow)) : food.filter(r => r.day === shown)).sort(byTime);

  // Today: each meal's items in time order, its first time, and a note they all share (e.g. "Tesco meal deal")
  const meals = MEALS_ALL.map(m => {
    const items = todayFood.filter(r => r.meal === m);
    const times = items.map(r => r.time).filter(Boolean).sort();
    const notes = new Set(items.map(r => r.notes));
    return { meal: m, items, kcal: items.reduce((s, r) => s + r.kcal, 0), time: times[0] || '', note: notes.size === 1 && items[0]?.notes || '' };
  });
  const sum = (rows, k) => rows.reduce((s, r) => s + (r[k] || 0), 0);
  const todayView = { day: shown, past: !!viewDay, loading: false, meals, total: sum(todayFood, 'kcal'), count: todayFood.length, macros: macroSplit(sum(todayFood, 'p'), sum(todayFood, 'c'), sum(todayFood, 'f')) };
  if (loading) {
    const row = days.get(viewDay);
    todayView.loading = true;
    if (row) { meals.forEach(m => { m.kcal = row.meals[m.meal] || 0; }); todayView.total = row.kcal; todayView.count = 1; todayView.macros = macroSplit(row.p, row.c, row.f); }
  }

  // This Week: the 7 days to today; not-logged days stay in the chart as gaps
  const weekDays = [];
  for (let k = -6; k <= 0; k++) {
    const d = addDays(today, k), row = days.get(d);
    weekDays.push({ date: d, logged: !!row, partial: d === today, meals: row ? row.meals : {}, total: row ? row.kcal : 0 });
  }
  const fullRows = weekDays.filter(d => d.logged && !d.partial).map(d => days.get(d.date));
  const avgOf = k => fullRows.length ? sum(fullRows, k) / fullRows.length : 0;
  const groups = new Map();
  for (const r of food) {
    const key = r.name.toLowerCase();
    let g = groups.get(key);
    if (!g) groups.set(key, g = { name: r.name, days: new Set(), n: 0, kcal: 0, icons: {}, meals: {} });
    g.days.add(r.day); g.n++; g.kcal += r.kcal;
    g.icons[r.icon] = (g.icons[r.icon] || 0) + 1; g.meals[r.meal] = (g.meals[r.meal] || 0) + 1;
  }
  const most = o => Object.entries(o).sort((a, b) => b[1] - a[1])[0][0];
  const topFoods = [...groups.values()].sort((a, b) => b.days.size - a.days.size || b.n - a.n || b.kcal - a.kcal).slice(0, 6)
    .map(g => ({ name: g.name, icon: most(g.icons), meal: most(g.meals), days: g.days.size }));

  // History: every logged day; today is still going
  const histDays = Object.fromEntries(loggedDays.map(d => [d, days.get(d).kcal]));

  // Weight: weigh-ins, the next Sunday, and how far the maintenance estimate has got (21 full days of logs)
  const weighIns = (raw.weight || []).filter(r => r && r.day && r.day <= today && numOr(r.kg) != null)
    .map(r => ({ date: r.day, kg: +r.kg })).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const dow = dayDate(today).getDay();
  const next = dow === 0 && !weighIns.some(w => w.date === today) ? today : addDays(today, dow === 0 ? 7 : 7 - dow);
  const fullLogged = loggedDays.filter(d => d !== today).length;

  return {
    today, maintenance: maint,
    todayView,
    week: { days: weekDays, macros: macroSplit(avgOf('p'), avgOf('c'), avgOf('f')), topFoods },
    history: { days: histDays, started: loggedDays[0] || null, partial: days.has(today) ? today : null },
    weight: { weighIns, next, maintenance: { kcal: maint, estimate, daysLogged: Math.min(fullLogged, DAYS_NEEDED), daysNeeded: DAYS_NEEDED, readyFrom: loggedDays[0] && fullLogged < DAYS_NEEDED ? addDays(today, DAYS_NEEDED - fullLogged) : null } },
  };
}

/* ---------- drawing: every screen, Control Center and the Dock, from the model ---------- */
const renderViews = (() => {
  const MEALS = ['breakfast', 'lunch', 'snacks', 'dinner'];
  const MEAL_NAME = { breakfast: 'Breakfast', lunch: 'Lunch', snacks: 'Snacks', dinner: 'Dinner', drinks: 'Drinks' };
  const esc = escHtml;
  const n = v => Math.round(v).toLocaleString('en-GB');
  const kg = v => v.toFixed(1);
  const gram = v => String(Math.round(v * 10) / 10);
  const signed = (v, f = n) => (v > 0 ? '+' : v < 0 ? '−' : '') + f(Math.abs(v));
  const date = dayDate, iso = dayIso;
  const part = (s, o) => date(s).toLocaleDateString('en-GB', o);
  const dShort = s => `${date(s).getDate()} ${part(s, { month: 'short' })}`;                         // 18 Oct
  const dMonth = s => `${date(s).getDate()} ${part(s, { month: 'long' })}`;                          // 1 November
  const dLong = s => `${part(s, { weekday: 'long' })} ${date(s).getDate()} ${part(s, { month: 'long' })}`;   // Sunday 8 November
  const wd = s => part(s, { weekday: 'short' });                                                      // Tue
  const pct = v => `${(+v).toFixed(2)}%`;
  const pct2 = v => `${+(+v).toFixed(2)}%`;
  const words = k => ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven'][k] ?? String(k);
  const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
  const icon = id => `<svg class="ic"><use href="#${id}"></use></svg>`;
  const header = (id, title, sub) => `<header class="day"><h1 class="day__title" id="${id}">${esc(title)}</h1><p class="day__date">${esc(sub)}</p></header>`;
  const foodIcon = k => `<span class="food__icon food__icon--${k}" aria-hidden="true"><svg viewBox="0 0 40 40">${FOOD_ICONS[k]}</svg></span>`;
  const emptyNote = (text, m = 'var(--c-all)', glyph = EMPTY_PLATE) => `<div class="empty-note" style="--m: ${m}"><span class="food__icon food__icon--empty" aria-hidden="true"><svg viewBox="0 0 40 40">${glyph}</svg></span><span>${esc(text)}</span></div>`;
  const donutOf = (M, firstOffset) => {
    if (!M) return '';
    let at = 0;
    return [['p', M.protein], ['c', M.carbs], ['f', M.fat]].map(([k, v]) => {
      const off = at || !firstOffset ? (at ? ` stroke-dashoffset="${-at}"` : '') : ' stroke-dashoffset="0"';
      const s = `<circle class="donut__seg donut__seg--${k}" cx="50" cy="50" r="40" pathLength="100" stroke-dasharray="${Math.max(v.pct - 1, 0)} 100"${off}></circle>`;
      at += v.pct; return s;
    }).join('');
  };
  const macroRows = M => [['p', 'Protein', 'protein'], ['c', 'Carbs', 'carbs'], ['f', 'Fat', 'fat']].map(([k, name, key]) =>
    `<li class="macro macro--${k}"><span class="macro__key" aria-hidden="true"></span><span class="macro__name">${name}</span><span class="macro__g">${M ? M[key].g : 0} g</span><span class="macro__pct${M ? '' : ' is-none'}">${M ? M[key].pct + '%' : '–'}</span></li>`).join('');

  /* Today: the ring, the macro split, the food tiles by meal (or one calm card when nothing's logged) */
  function todayPanel(el, T, maint, today) {
    const total = T.total, scale = Math.max(maint, total), over = total > maint, full = total >= maint;
    const arcs = T.meals.filter(m => m.kcal > 0);
    let at = 0;
    const segs = arcs.map((m, i) => {
      const gap = i < arcs.length - 1 || full ? 6 : 0;   // a hairline between meals; the last one runs on to what's left
      const s = `<circle class="gauge__seg gauge__seg--${m.meal}" cx="120" cy="120" r="110" pathLength="${scale}" stroke-dasharray="${Math.max(m.kcal - gap, 0)} ${scale}"${at ? ` stroke-dashoffset="-${at}"` : ''}></circle>`;
      at += m.kcal; return s;
    }).join('');
    const rest = over ? total - maint : maint - total;
    const mealsSaid = arcs.map((m, i) => `${i ? MEAL_NAME[m.meal].toLowerCase() : MEAL_NAME[m.meal]} ${n(m.kcal)}`).join(', ');
    const past = T.past, day = T.day;
    const said = T.count
      ? `${n(total)} of ${n(maint)} kcal${past ? '' : ' so far'}, ${n(rest)} ${over ? 'over' : past ? 'under' : 'left'}.${mealsSaid ? ' ' + mealsSaid + '.' : ''}`
      : past ? `Nothing logged: 0 of ${n(maint)} kcal.` : `Nothing logged yet: 0 of ${n(maint)} kcal, ${n(maint)} left.`;
    const M = T.macros;

    const tile = (r, wide) => {
      const mac = [['P', 'protein', r.p], ['C', 'carbs', r.c], ['F', 'fat', r.f]].filter(x => x[2] != null);
      const title = [r.name, r.portion, mac.map(([k, , v]) => `${k} ${gram(v)} g`).join(', '), r.source, `fills ${Math.min(100, Math.round(r.kcal / 5))}% of a tile`].filter(Boolean).join(' · ');
      const src = !r.source ? '' : /^estimate$/i.test(r.source) ? ' An estimate.' : ` Source: ${r.source}.`;
      const sr = `${r.name}${r.portion ? ', ' + r.portion : ''}. ${n(r.kcal)} kcal${mac.length ? ': ' + mac.map(([, w, v]) => `${w} ${gram(v)} g`).join(', ') : ''}.${src}`;

  function ccWeight(el, Wt, today) {

  function week(el, W, maint, today) {

  // History on the desktop sheet (fitHistory switches it on): squares sized from the pane's width alone.

  function packTiles() {

  function fitHistory() {

  function history(el, H, maint, today) {
    histLast = [el, H, maint, today];

    const overDays = full.filter(d => H.days[d] > maint);

    const todayK = H.partial ? H.days[H.partial] : null;   // no full day yet: the stats speak for today, "so far"
    let streak = 0;   // logged days in a row, back from today (or from yesterday while today is still empty)
    for (let d = date(H.days[today] != null ? today : addDays(today, -1)); H.days[iso(d)] != null; d.setDate(d.getDate() - 1)) streak++;

    to.setDate(to.getDate() + 6); oldest.setDate(oldest.getDate() - 7 * 7);
    const from = new Date(Math.max(mon(logged[0] || today), oldest));
    const startedOn = logged[0] || today;
    let i = 0, named = false;   // the month goes on the first numbered square, and on each 1st
    const cells = [];
    for (const d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
      const s = iso(d), k = H.days[s], first = !named || d.getDate() === 1;
      named = true;
      const label = first ? `${d.getDate()}<span class="heat__mon"> ${esc(part(s, { month: 'short' }))}</span>` : String(d.getDate());
      if (s === today && k != null) cells.push(`<li class="heat__day is-logged ${k > maint ? 'is-over' : 'is-under'} is-today" style="--t: ${tint(k)}; --i: ${i++}" title="Today: ${n(k)} kcal so far"><span class="heat__date">${label}</span>${kcalCell(k)}${go(s, `${dLong(s)}, today, ${n(k)} kcal so far`)}</li>`);
      else if (s === today) cells.push(`<li class="heat__day is-empty is-today" title="Today: nothing logged yet" aria-label="${esc(dLong(s))}, today, nothing logged yet"><span class="heat__date">${label}</span></li>`);
      else if (k != null) cells.push(`<li class="heat__day is-logged ${k > maint ? 'is-over' : 'is-under'}" style="--t: ${tint(k)}; --i: ${i++}" title="${esc(wd(s))} ${esc(dShort(s))}: ${n(k)} kcal"><span class="heat__date">${label}</span>${kcalCell(k)}${go(s, `${dLong(s)}, ${n(k)} kcal, ${n(Math.abs(k - maint))} ${k > maint ? 'over' : 'under'}`)}</li>`);
      // not logged: before logging started (a faint dot), missed (dashed), still to come (a hairline)
      else { const st = s > today ? ['future', 'still to come'] : s < startedOn ? ['before', 'before logging started'] : ['missed', 'not logged'];
        cells.push(`<li class="heat__day is-empty is-${st[0]}" aria-label="${esc(dLong(s))}, ${st[1]}"><span class="heat__date">${label}</span></li>`); }
    }
    // the trend, from 3 logged days: each day by date, y from 0 with gridlines, maintenance dashed, and today a

    const span0 = logged.length ? Math.round((date(today) - date(logged[0])) / 864e5) : 0;
    const X = d => span0 ? Math.round((date(d) - date(logged[0])) / 864e5) / span0 * 100 : 100;
    const step = 1000, top = Math.max(3000, Math.ceil(Math.max(maint, ...logged.map(d => H.days[d])) * 1.08 / step) * step);
    const Y = k => k / top * 100;
    const pt = d => `${X(d).toFixed(2)},${(100 - Y(H.days[d])).toFixed(2)}`;
    const tLine = full.length > 1 ? `M${full.map(pt).join('L')}` : '';
    const tArea = full.length > 1 ? `M${X(full[0]).toFixed(2)},100L${full.map(pt).join('L')}L${X(full.at(-1)).toFixed(2)},100Z` : '';

    const ticks = Array.from({ length: top / step + 1 }, (_, j) => j * step);

/* ---------- reading the log: sign-in, fetch, cache, refresh ----------
   Password sign-in with the Planner account (same as the To Do app): a session with a refresh token,
   the publishable key on every call. Reads only. Refreshes on focus and every minute, because Claude adds rows
   from elsewhere; the screens redraw only when something actually changed. */
const log = (() => {
  const EMPTY = { food: [], days: [], weight: [], settings: [] };
  let session = SEED ? null : store.get(SESSION_KEY);
  let raw = null, sig = '', state = 'off', lastAt = 0, lastErr = '', busy = false, again = false, lastTry = 0;
  let viewDay = null;   // a past day picked in History (null: today)
  let gen = 0;   // goes up on every sign-out: a refresh that started before it must not save anything
  const changed = [], signedOut = [];
  const setState = s => { state = s; changed.forEach(f => f()); };

  async function api(method, path, body, auth = true) {
    const headers = { apikey: SUPABASE_KEY };
    if (body) headers['Content-Type'] = 'application/json';
    if (auth) headers.Authorization = `Bearer ${session.access_token}`;
    const r = await fetch(SUPABASE_URL + path, { method, headers, body: body && JSON.stringify(body), cache: 'no-store' });
    const text = await r.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch {}
    if (!r.ok) {
      const err = new Error((data && (data.msg || data.message || data.error_description || data.error)) || `Error ${r.status}`);
      err.status = r.status; throw err;
    }
    return data;
  }
  function keepSession(d) {
    session = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + d.expires_in * 1000, email: d.user.email, id: d.user.id };
    store.set(SESSION_KEY, session);
  }
  const signedOutErr = () => Object.assign(new Error('Signed out'), { status: 0 });
  async function ensureToken(force = false) {
    // another tab may have refreshed it already: a used refresh token is refused
    const saved = store.get(SESSION_KEY);
    if (saved && saved.id === session.id && saved.expires_at > session.expires_at) session = saved;
    if (!force && session.expires_at - Date.now() > 60e3) return;
    const g = gen;
    let d;
    try { d = await api('POST', '/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token }, false); }
    catch (e) { if (g === gen && (e.status === 400 || e.status === 401)) signOut(); throw e; }
    if (g !== gen || !session) throw signedOutErr();   // signed out while it was on its way: don't save it
    keepSession(d);
  }

  // today's food and the week's (for Eaten most), every logged day's totals, the weigh-ins, maintenance
  const paths = today => [
    `/rest/v1/calorie_food?select=id,day,meal,eaten_at,name,portion,kcal,protein_g,carbs_g,fat_g,source,icon,notes,created_at&day=gte.${addDays(today, -6)}&day=lte.${today}&order=day.asc,eaten_at.asc.nullslast,created_at.asc`,
    '/rest/v1/calorie_days?select=day,kcal,protein_g,carbs_g,fat_g,breakfast_kcal,lunch_kcal,snacks_kcal,dinner_kcal,drinks_kcal,items&order=day.asc',
    '/rest/v1/calorie_weight?select=day,kg&order=day.asc',
    '/rest/v1/calorie_settings?select=maintenance_kcal',
  ];
  async function read(today) {
    const get = SEED ? p => Promise.resolve(SEED.rest(p)) : p => api('GET', p);   // the test copy never fetches
    // a picked day older than the week's food gets a read of its own
    const day = viewDay && viewDay < addDays(today, -6) ? viewDay : null, ps = paths(today);
    if (day) ps.push(`/rest/v1/calorie_food?select=id,day,meal,eaten_at,name,portion,kcal,protein_g,carbs_g,fat_g,source,icon,notes,created_at&day=eq.${day}&order=eaten_at.asc.nullslast,created_at.asc`);
    const [food, days, weight, settings, dayRows] = await Promise.all(ps.map(get));
    return { food: food || [], days: days || [], weight: weight || [], settings: settings || [], dayFood: day ? { day, rows: dayRows || [] } : null };
  }
  function draw(r) {
    const today = londonToday(), s = JSON.stringify([today, viewDay, r.food, r.days, r.weight, r.settings, r.dayFood]);
    if (s === sig) return;   // nothing new: leave the screens (and their grow-in animations) alone
    sig = s;
    renderViews(buildModel(r, today, viewDay));
  }
  async function refresh() {
    lastTry = Date.now();
    if (SEED) {
      if (SEED.signedOut) { draw(EMPTY); return setState('off'); }
      raw = await read(londonToday()); lastAt = Date.now(); draw(raw);
      return setState('seed');
    }
    if (!session) { draw(EMPTY); return setState('off'); }
    if (busy) { again = true; return; }
    busy = true; setState('busy');
    const g = gen;
    try {
      await ensureToken();
      let r;
      try { r = await read(londonToday()); }
      catch (e) {   // a 401 on a read: the token went stale early, so refresh it once and try once more
        if (e.status !== 401 || g !== gen) throw e;
        await ensureToken(true);
        r = await read(londonToday());
      }
      if (g !== gen || !session) throw signedOutErr();
      raw = { ...r, user: session.id, at: Date.now() };
      store.set(CACHE_KEY, raw);
      lastAt = raw.at; lastErr = '';
      draw(raw); setState('ok');
    } catch (e) {
      lastErr = e.message || String(e);
      if (raw) draw(raw);   // past midnight the saved rows still move on to the new day
      setState(!session ? 'off' : !navigator.onLine || e instanceof TypeError ? 'offline' : 'error');
    }
    busy = false;
    if (again) { again = false; refresh(); }
  }
  async function signIn(email, password) {
    if (SEED) { const e = new Error('This is the test copy: signing in is switched off here.'); e.status = 0; throw e; }
    keepSession(await api('POST', '/auth/v1/token?grant_type=password', { email, password }, false));
    sig = ''; raw = null;
    await refresh();
  }
  function signOut() {
    gen++;
    session = null; raw = null; lastAt = 0;
    store.del(SESSION_KEY); store.del(CACHE_KEY);   // nothing of his stays on the device
    draw(EMPTY); setState('off');
    signedOut.forEach(f => f());
  }
  // History picked a day (or null, back to today): draw it from what's here, and fetch its food if it's older
  function setDay(d) {
    const today = londonToday();
    d = d && d < today ? d : null;
    if (d === viewDay) return;
    viewDay = d;
    draw(raw || EMPTY);
    if (d && d < addDays(today, -6) && !(raw && raw.dayFood && raw.dayFood.day === d)) refresh();
  }
  function boot() {
    if (!SEED && session) { const c = store.get(CACHE_KEY); if (c && c.user === session.id) { raw = c; lastAt = c.at || 0; } }
    draw(raw || EMPTY);   // straight away, before any network: the saved day, or the empty screens
    state = SEED ? (SEED.signedOut ? 'off' : 'seed') : session ? 'busy' : 'off';
    refresh();
    const soon = () => { if (Date.now() - lastTry > 5e3) refresh(); };
    addEventListener('focus', soon);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) soon(); });
    addEventListener('online', refresh);
    setInterval(() => { if (!document.hidden) refresh(); }, 60e3);
  }
  return {
    boot, refresh, signIn, signOut, setDay,
    info: () => ({ state, lastAt, lastErr, email: session?.email || '' }),
    onChange: f => changed.push(f), onSignedOut: f => signedOut.push(f),
  };
})();

/* ---------- the sidebar: switch views in place, no reload ---------- */
// The view is kept in the address (#week, #history, #weight) so a refresh stays put. The Dock is today's meals,
// so a meal icon brings Today back first, then the Dock script above shows the meal.
const views = (() => {
  const rows = [...document.querySelectorAll('.navrow[data-view]')];
  const panels = Object.fromEntries([...document.querySelectorAll('[data-panel]')].map(p => [p.dataset.panel, p]));
  const hint = document.getElementById('pane-hint'), todayHint = hint?.textContent;
  const scroller = document.querySelector('.pane__scroll');
  const ccWeek = document.querySelector('.cc-week');
  const ccWeightMods = [...document.querySelectorAll('.cc-weight, .cc-maint')];
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let current = null;
  // A date (#2026-11-08, from a square in History) is that day on the Today screen, with History still lit.
  function show(key, { scroll = true } = {}) {
    const day = /^\d{4}-\d\d-\d\d$/.test(key) && key < londonToday() ? key : null;
    if (!day && !panels[key]) key = 'today';
    if (key === current) return;
    current = key;
    const name = day ? 'today' : key, lit = day ? 'history' : key;
    log.setDay(day);
    rows.forEach(r => r.dataset.view === lit ? r.setAttribute('aria-current', 'page') : r.removeAttribute('aria-current'));
    for (const [k, p] of Object.entries(panels)) {
      p.hidden = k !== name;
      p.classList.remove('view-in');
    }
    if (!still.matches) { void panels[name].offsetWidth; panels[name].classList.add('view-in'); }
    if (hint) hint.textContent = name in VIEW_HINTS ? VIEW_HINTS[name] : panels.today?.dataset.hint || todayHint;
    document.body.dataset.view = name;
    // Control Center's Last 7 days is the This Week hero in small: leave it out there. The modules below move up,
    // so their baked glass is redrawn for the new spots (the live blur covers the moment in between).
    if (ccWeek && ccWeek.hidden !== (name === 'week')) { ccWeek.hidden = name === 'week'; glass.soon?.(); }
    // the same for Weight: the pane already shows the weight and maintenance, so their modules leave too
    if (ccWeightMods.length && ccWeightMods[0].hidden !== (name === 'weight')) { ccWeightMods.forEach(m => { m.hidden = name === 'weight'; }); glass.soon?.(); }
    if (scroll && scroller) scroller.scrollTop = 0;
    const want = key === 'today' ? location.pathname + location.search : '#' + key;
    if ((location.hash || '') !== (key === 'today' ? '' : '#' + key)) history.replaceState(null, '', want);
  }
  Object.values(panels).forEach(p => p.addEventListener('animationend', e => { if (e.target === p) p.classList.remove('view-in'); }));
  rows.forEach(r => r.addEventListener('click', () => show(r.dataset.view)));
  // the Dock is the meals of the day on screen: it only has to bring Today back from the other views
  document.querySelector('.dock')?.addEventListener('click', e => { if (e.target.closest('[data-meal]') && panels.today?.hidden) show('today', { scroll: false }); }, true);
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  current = 'today';
  const start = location.hash.slice(1);
  if (start && start !== 'today') show(start);
  return { show };
})();

/* ---------- account: the footer's status, its menu, and the Sign In sheet ---------- */
(() => {
  const btn = document.getElementById('acct'), label = btn?.querySelector('.acct__label'), menu = document.getElementById('acct-menu');
  const dlg = document.getElementById('signin'), form = document.getElementById('signin-form');
  if (!btn || !menu || !dlg || !form) return;
  const msg = form.querySelector('.signin__msg'), submit = form.querySelector('button[type="submit"]');
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const clock = t => {
    const time = new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' });
    const day = new Date(t).toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
    return day === londonToday() ? time : `${new Date(t).toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'Europe/London' })} ${time}`;
  };
  function text(i) {
    if (i.state === 'off') return 'Sign In';
    if (i.state === 'seed') return 'Test data';
    if (i.state === 'offline') return i.lastAt ? `Offline · saved ${clock(i.lastAt)}` : 'Offline';
    if (i.state === 'error') return 'Couldn’t update';
    return i.lastAt ? `Updated ${clock(i.lastAt)}` : 'Loading…';   // busy keeps the last time, so the minute tick doesn't flicker
  }
  function fillMenu() {
    const i = log.info(), seed = i.state === 'seed', at = i.lastAt ? clock(i.lastAt) : '';
    const when = seed ? 'Rows come from seed.js. Add ?empty to the address to see no rows.'
      : i.state === 'busy' ? 'Checking for new food…'
      : i.state === 'offline' ? `Offline. Showing what was saved${at ? ' at ' + at : ''}.`
      : i.state === 'error' ? `Couldn’t update (${i.lastErr}). Showing what was saved${at ? ' at ' + at : ''}.`
      : `Updated ${at}. Checks for new food every minute.`;
    menu.innerHTML = `<p class="acct-menu__who">${seed ? 'Test copy' : 'Signed in as'}<b>${escHtml(seed ? 'Seed data, nothing is fetched' : i.email)}</b></p>
      <p class="acct-menu__when">${escHtml(when)}</p>
      <div class="acct-menu__row">${seed ? '' : '<button class="acct-menu__btn acct-menu__btn--out" type="button" data-acct="out">Sign Out</button>'}<button class="acct-menu__btn" type="button" data-acct="now">Refresh</button></div>`;
  }
  function paint() {
    const i = log.info(), t = text(i);
    btn.dataset.state = i.state;
    label.textContent = t;
    btn.setAttribute('aria-label', i.state === 'off' ? 'Sign in' : `Account: ${t}`);
    if (!menu.hidden) fillMenu();
  }
  function openMenu() { fillMenu(); menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); void menu.offsetWidth; menu.classList.add('is-open'); }
  function closeMenu() {
    if (menu.hidden) return;
    menu.classList.remove('is-open'); btn.setAttribute('aria-expanded', 'false');
    const done = () => { if (!menu.classList.contains('is-open')) menu.hidden = true; };
    if (still.matches) done(); else setTimeout(done, 180);
  }
  function openSignIn() {
    closeMenu();
    if (dlg.open) return;
    msg.textContent = '';
    dlg.showModal();
    void dlg.offsetWidth; dlg.classList.add('is-in');
  }
  function closeSignIn() {
    dlg.classList.remove('is-in');
    const done = () => { if (dlg.open && !dlg.classList.contains('is-in')) dlg.close(); };
    if (still.matches) done(); else setTimeout(done, 230);
  }
  btn.addEventListener('click', () => { if (log.info().state === 'off') openSignIn(); else if (menu.hidden) openMenu(); else closeMenu(); });
  menu.addEventListener('click', e => {
    const b = e.target.closest('[data-acct]'); if (!b) return;
    closeMenu();
    if (b.dataset.acct === 'now') log.refresh(); else log.signOut();
  });
  document.addEventListener('pointerdown', e => { if (!menu.hidden && !menu.contains(e.target) && !btn.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { closeMenu(); btn.focus(); } });
  dlg.addEventListener('cancel', e => { e.preventDefault(); closeSignIn(); });   // Esc: the footer's Sign In opens it again
  dlg.addEventListener('click', e => { if (e.target === dlg) closeSignIn(); });
  const hold = e => { if (dlg.open && dlg.offsetHeight <= innerHeight) e.preventDefault(); };   // only while the sheet fits the screen
  dlg.addEventListener('wheel', hold, { passive: false });
  dlg.addEventListener('touchmove', hold, { passive: false });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    submit.disabled = true; msg.textContent = '';
    try { await log.signIn(form.email.value.trim(), form.password.value); form.password.value = ''; closeSignIn(); }
    catch (err) {
      msg.textContent = err.status === 400 ? 'That email and password didn’t match.'
        : err.status === 0 ? err.message
        : err instanceof TypeError ? 'Couldn’t reach the server. Check you’re online and try again.'
        : `Couldn’t sign in: ${err.message}`;
    }
    submit.disabled = false;
  });
  log.onChange(paint);
  log.onSignedOut(openSignIn);
  log.boot();
  paint();
  if (log.info().state === 'off') openSignIn();
})();

/* ---------- a newer page: the Dock app stays open for days, so it looks for one and reloads itself ----------
   On focus (ten minutes apart at most) it asks the server when the page last changed. Newer than the copy on
   screen: reload, once for each new version, so a stale cache can never make it loop. */
(() => {
  if (SEED || !/^https?:$/.test(location.protocol)) return;
  const mine = Date.parse(document.lastModified);
  let last = 0;
  async function check() {
    if (document.hidden || Date.now() - last < 600e3) return;
    last = Date.now();
    try {
      const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      const theirs = Date.parse(r.headers.get('last-modified') || '');
      if (!r.ok || !(theirs > mine + 2000)) return;
      let done = ''; try { done = sessionStorage.getItem('ct-reloaded') || ''; } catch {}
      if (done === String(theirs)) return;
      try { sessionStorage.setItem('ct-reloaded', String(theirs)); } catch { return; }
      location.reload();
    } catch {}
  }
  addEventListener('focus', check);
  document.addEventListener('visibilitychange', check);
  setTimeout(check, 3000);
})();

(document.fonts?.ready || Promise.resolve()).then(() => glass.refresh());
</script>
</body>
